        invoice_id: {type: integer, nullable: true, example: 42}
        event: {type: string, nullable: true, description: "Событие вебхука (invoice.status_changed / invoice.qr_scanned / invoice.refunded / ...).", example: invoice.status_changed}
        url: {type: string, example: "https://example.com/webhook"}
        request_body: {type: string, description: Полный отправленный payload (JSON-строка).}
        response_body: {type: string, nullable: true, description: Ответ приёмника (обрезан до 4096 байт).}
        response_status: {type: integer, nullable: true, example: 200}
        status: {type: string, enum: [success, failed], description: Итог доставки этой попытки.}
        response_time_ms: {type: integer, nullable: true, example: 150}
        error_message: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        retry_of: {type: integer, nullable: true, description: ID исходного лога, если это повторная отправка.}
    CatalogWebhookLogEntry:
      type: object
      description: Запись лога доставки вебхука catalog.item_processed (GET /catalog/webhook-logs). Логи хранятся 3 дня.
      properties:
        id: {type: integer, example: 1}
        api_key_id: {type: integer, nullable: true, example: 1}
        api_key_name: {type: string, nullable: true, example: Production}
        catalog_item_id: {type: integer, nullable: true, example: 12345}
        event: {type: string, example: catalog.item_processed}
        url: {type: string, example: "https://example.com/webhook"}
        request_body: {type: string, description: Полный отправленный payload (JSON-строка).}
        response_body: {type: string, nullable: true, description: Ответ приёмника (обрезан до 1000 байт).}
        response_status: {type: integer, nullable: true, example: 200}
        status: {type: string, enum: [success, failed], description: Итог доставки этой попытки.}
        response_time_ms: {type: integer, nullable: true, example: 150}
        error_message: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
    CatalogQueueItem:
      type: object
      description: Слим-строка pending-очереди приёма каталога (GET /catalog/queue).
      properties:
        id: {type: integer, example: 123}
        external_ref: {type: string, nullable: true, example: "1C-000123", description: Клиентская ссылка 1С (ключ маппинга).}
        name: {type: string, example: "Фильтр масляный"}
        queued_at: {type: string, format: date-time, description: "Момент постановки в очередь (created_at), Asia/Almaty +05:00.", example: "2026-07-11T10:00:00+05:00"}
    CatalogQueueBlock:
      type: object
      description: |
        Сводка состояния очереди приёма каталога. `eta_minutes` — целое ТОЛЬКО при
        `state=draining` и непустой своей очереди, иначе null. `ahead_in_cashier_queue` —
        число pending кассира (всех его организаций) до конца своей очереди включительно.
      properties:
        state:
          type: string
          enum: [draining, paused_throttle, paused_hold, not_connected, sandbox]
          description: |
            draining — очередь двигается; paused_throttle — пауза из-за троттла Kaspi
            (см. throttle_retry_in_seconds); paused_hold — пауза-накопление (hold);
            not_connected — у организации нет подключённого кассира; sandbox — sandbox-режим.
          example: draining
        ahead_in_cashier_queue: {type: integer, example: 2200}
        eta_minutes: {type: integer, nullable: true, example: 11}
        throttle_retry_in_seconds: {type: integer, nullable: true, description: "Секунды до остывания троттла (только при state=paused_throttle).", example: null}
    CatalogErrorItem:
      type: object
      description: |
        Failed-позиция приёма каталога (GET /catalog/errors). `error_message` обезличен:
        сырые ответы Kaspi заменяются generic-текстом; для распознанных слагов — actionable.
      properties:
        id: {type: integer, example: 456}
        external_ref: {type: string, nullable: true, example: "1C-000456"}
        name: {type: string, example: "Фильтр воздушный"}
        barcode: {type: string, nullable: true, example: "4600000000001"}
        ntin: {type: string, nullable: true, example: "00000000000001"}
        error_code: {type: string, nullable: true, example: catalog_item_duplicate}
        error_message: {type: string, description: "Обезличенный клиентский текст (без сырых ответов Kaspi).", example: "Такая позиция уже есть в каталоге."}
        queued_at: {type: string, format: date-time, description: "created_at, +05:00.", example: "2026-07-11T10:00:00+05:00"}
        failed_at: {type: string, format: date-time, description: "updated_at, +05:00.", example: "2026-07-11T10:03:00+05:00"}
        batch_id: {type: string, nullable: true, format: uuid, description: "UUID батча приёма (до появления батчей — null)."}
    CatalogBatch:
      type: object
      description: |
        Агрегат bulk-батча каталога (POST /catalog инжест-путь · GET /catalog/batches/{id}).

        ⚠️ **Инвариант totals зависит от `kind`:**
          * `ingest` — `total = created + updated + skipped + failed` (`deleted` всегда 0);
          * `delete` — `total = deleted + skipped + failed` (`created`/`updated` всегда 0).

        `skipped` включает идемпотентные skip'ы (позиция уже такая же, как в каталоге Kaspi) +
        intra-batch дубли + matched-без-работы; у батча удаления — позиции, ушедшие из работы
        не через удаление (например, переизданные повторной заливкой).

        Ключ `deleted` присутствует ВСЕГДА (у `ingest` — ноль), чтобы форма ответа не зависела
        от вида батча.
      properties:
        batch_id: {type: string, format: uuid, example: "8f14e45f-ceea-467e-9a2c-0000000000aa"}
        kind:
          type: string
          enum: [ingest, delete]
          description: "Вид батча. Определяет, какой инвариант totals применять (см. описание схемы)."
          example: ingest
        status:
          type: string
          enum: [accepted, processing, completed, partially_failed]
          description: "processing — строки в очереди дрипа; completed/partially_failed — все финализированы (partially_failed = были failed)."
          example: processing
        totals:
          type: object
          properties:
            total: {type: integer, description: "Принятые items (без rejected).", example: 6870}
            created: {type: integer, example: 5868}
            updated: {type: integer, example: 3}
            deleted: {type: integer, description: "Позиции, снятые в Kaspi. Ненулевой только у `kind: delete`.", example: 0}
            skipped: {type: integer, example: 996}
            failed: {type: integer, example: 3}
        pending_remaining: {type: integer, description: "Сколько строк батча ещё не финализировано (0 = готово).", example: 1002}
        poll_url: {type: string, description: "URL GET /catalog/batches/{id}.", example: "https://api.apipay.kz/api/v1/catalog/batches/8f14e45f-ceea-467e-9a2c-0000000000aa"}
        created_at: {type: string, format: date-time, nullable: true, example: "2026-07-11T10:00:00+00:00"}
        completed_at: {type: string, format: date-time, nullable: true, example: null}
    WebhookCatalogItemProcessed:
      type: object
      description: |
        Payload вебхука catalog.item_processed. Таймстамп UTC +00:00. Сверяйте по
        catalog_item.external_ref (ключ маппинга 1С, UNIQUE per org).
      properties:
        event: {type: string, example: catalog.item_processed}
        catalog_item:
          type: object
          properties:
            id: {type: integer, example: 12345}
            external_ref: {type: string, nullable: true, description: "Клиентская ссылка 1С (ключ сверки, UNIQUE per org).", example: "1c-товар-0042"}
            kaspi_item_id: {type: string, nullable: true, example: "MP-987654"}
            name: {type: string, example: "Кофе зерновой 1 кг"}
            barcode: {type: string, nullable: true, example: "4870000000001"}
            ntin: {type: string, nullable: true, example: "07622300000001"}
            gtin: {type: string, nullable: true, example: "07622300000001"}
            ntin_missing: {type: boolean, description: "true = есть barcode, нет НТИН → позиция не попадёт в фискальный чек (notify-only).", example: false}
            status: {type: string, enum: [active, failed], example: active}
            error_code: {type: string, nullable: true, description: "snake_case-код (non-null только при status=failed).", example: null}
            error_message: {type: string, nullable: true}
        timestamp: {type: string, format: date-time, example: "2026-07-09T14:37:00+00:00"}
    WebhookCatalogBatchProcessed:
      type: object
      description: |
        Payload вебхука catalog.batch_processed. Таймстамп UTC +00:00. Дедуп по
        `(batch_id, status)`. `sample_failed` — до 50 позиций БЕЗ error_message и имён
        товаров (anti-leak); полные ошибки — GET /catalog/errors?batch_id=.
      properties:
        event: {type: string, example: catalog.batch_processed}
        batch_id: {type: string, format: uuid, example: "8f14e45f-ceea-467e-9a2c-0000000000aa"}
        kind:
          type: string
          enum: [ingest, delete]
          description: "Вид батча — определяет, какой инвариант totals применять (см. CatalogBatch)."
          example: ingest
        status: {type: string, enum: [completed, partially_failed], example: partially_failed}
        totals:
          type: object
          properties:
            total: {type: integer, example: 6870}
            created: {type: integer, example: 5868}
            updated: {type: integer, example: 3}
            deleted: {type: integer, description: "Ненулевой только у `kind: delete`.", example: 0}
            skipped: {type: integer, example: 996}
            failed: {type: integer, example: 3}
        sample_failed:
          type: array
          description: "До 50 отвергнутых позиций (external_ref + error_code, без текста)."
          items:
            type: object
            properties:
              external_ref: {type: string, nullable: true, example: "1C-000456"}
              error_code: {type: string, nullable: true, example: catalog_item_duplicate}
        poll_url: {type: string, example: "https://api.apipay.kz/api/v1/catalog/batches/8f14e45f-ceea-467e-9a2c-0000000000aa"}
        timestamp: {type: string, format: date-time, example: "2026-07-11T10:12:00+00:00"}
    WebhookReceiptEvent:
      type: object
      description: |
        Payload вебхуков receipt.issued / receipt.failed. Таймстамп UTC +00:00.
        Дедуп по `(event, receipt.id)`. При failed — детали в `receipt.error_code`.
      properties:
        event: {type: string, enum: [receipt.issued, receipt.failed], example: receipt.issued}
        receipt:
          type: object
          properties:
            id: {type: integer, example: 4210}
            client_operation_id: {type: string, nullable: true, example: "pos-cash-0042"}
            payment_type: {type: integer, enum: [3, 5], example: 3}
            status: {type: string, enum: [issued, failed], example: issued}
            fpd: {type: string, nullable: true, example: "000000000000"}
            operation_id: {type: string, nullable: true, example: "KKM00000000"}
            link: {type: string, nullable: true, description: "Публичная страница чека (`receipt.kaspi.kz/web/fiscal`) — открывается в обычном браузере.", example: "https://receipt.kaspi.kz/web/fiscal?i=000000000000&f=000000000000&s=10&t=2026-07-12%2015%3A25%3A43"}
            shift_number: {type: integer, nullable: true, example: 106}
            total_price: {type: string, nullable: true, example: "10.00"}
            error_code: {type: string, nullable: true, example: null}
            error_message: {type: string, nullable: true}
        timestamp: {type: string, format: date-time, example: "2026-07-12T16:25:43+00:00"}
    TariffSnapshot:
      type: object
      description: Снимок подписки мерчанта на ApiPay. Даты Asia/Almaty +05:00.
      properties:
        status: {type: string, enum: [none, trial, active, expired], example: active}
        tier: {type: string, nullable: true, example: business}
        tier_label:
          type: string
          description: |
            Имя тарифа так, как оно продано ЭТОМУ мерчанту. Обычно совпадает с именем из
            каталога (`Business`), но у мерчанта с индивидуальными условиями это его
            договорное имя. Витринное поле: switch-логику стройте по `tier`.
          example: Business
        daily_limit:
          type: integer
          nullable: true
          description: |
            Суточный лимит счетов, действующий у ЭТОГО мерчанта (у индивидуальных условий
            он отличается от каталожного). `null` зарезервирован под тариф без лимита,
            которого сейчас в каталоге нет.
          example: 300
        is_custom:
          type: boolean
          description: |
            true — у организации индивидуальные условия (свой лимит и своя цена).
            ⛔ `tier` при этом остаётся ОБЫЧНЫМ идентификатором (`pro`), значения `custom`
            не существует. Смена тарифа таким мерчантом отбивается `409 custom_tariff_locked`
            — переход оформляет поддержка.
          example: false
        is_trial: {type: boolean, example: false}
        started_at: {type: string, format: date-time, nullable: true, example: "2026-01-01T00:00:00+05:00"}
        expires_at: {type: string, format: date-time, nullable: true}
        days_remaining: {type: integer, example: 20}
        auto_renew: {type: boolean, example: false}
        last_payment:
          type: object
          nullable: true
          properties:
            amount: {type: integer, example: 71250}
            paid_at: {type: string, format: date-time, nullable: true}
            period_months: {type: integer, example: 3}
            tier: {type: string, example: business}
            status: {type: string, example: paid}
        next_payment:
          type: object
          properties:
            due_at: {type: string, format: date-time, nullable: true, description: "null для expired."}
            amount: {type: integer, example: 71250}
            tier: {type: string, example: business}
    AccountHealth:
      type: object
      description: Health аккаунта. Даты Asia/Almaty +05:00.
      properties:
        api:
          type: object
          properties:
            status: {type: string, example: ok}
        connection:
          type: object
          properties:
            kaspi_connected: {type: boolean, example: true}
            session_status:
              type: string
              nullable: true
              enum: [active, expired, error]
              description: |
                Здоровье Kaspi-сессии кассира — так детектится «слетела сессия» (поллинг, без вебхука).
                `active` — сессия жива (либо ещё ни разу не проверялась); `expired`/`error` — мертва,
                нужна переавторизация кассира: до неё создание счетов и чеков отдаёт
                `409 kaspi_session_expired`. `null` — активного кассира нет вовсе.
              example: active
            session_error_at:
              type: string
              format: date-time
              nullable: true
              description: "Когда сессия была признана мёртвой (null, если жива)."
            needs_reauth:
              type: boolean
              description: "true — сессию надо переподключить (эквивалент session_status ∈ {expired, error})."
              example: false
            last_used_at: {type: string, format: date-time, nullable: true}
        tariff:
          type: object
          properties:
            status: {type: string, example: active}
            expires_at: {type: string, format: date-time, nullable: true}
            days_remaining: {type: integer, example: 20}
        invoicing:
          type: object
          properties:
            accumulating: {type: boolean, description: "true — счета копятся (кассир в hold), в Kaspi не уходят.", example: false}
            held_since: {type: string, format: date-time, nullable: true}
    Connection:
      type: object
      description: Кассир организации. Поля `kaspi_user_id` и `cashier_phone` маскируются.
      properties:
        id: {type: integer, example: 7}
        label: {type: string, nullable: true, example: Касса №1}
        kaspi_user_id: {type: string, description: "Маскированный идентификатор.", example: "770****4567"}
        session_mode: {type: string, description: "self / external.", example: self}
        status: {type: string, example: active}
        is_primary: {type: boolean, example: true}
        cashier_phone: {type: string, nullable: true, description: "Маскированный телефон кассира."}
        last_used_at: {type: string, format: date-time, nullable: true, example: "2026-01-10T12:00:00+00:00"}
        created_at: {type: string, format: date-time, example: "2026-01-01T09:00:00+00:00"}
    CatalogItem:
      type: object
      description: Товар каталога. Даты UTC +00:00.
      properties:
        id: {type: integer, example: 1}
        kaspi_item_id: {type: string, nullable: true}
        name: {type: string, example: Coffee Latte}
        unit_id: {type: integer, nullable: true, example: 1}
        selling_price: {type: number, example: 1800}
        date_added: {type: string, format: date-time, nullable: true}
        image_url: {type: string, nullable: true}
        first_char: {type: string, nullable: true}
        nds_percentage: {type: number, nullable: true}
        barcode: {type: string, nullable: true, example: "4901234567890"}
        ntin: {type: string, nullable: true, description: "НТИН Нацкаталога."}
        gtin: {type: string, nullable: true, description: "GTIN (листинг Kaspi его не отдаёт, sync не затирает)."}
        unified_goods_id: {type: string, nullable: true, description: "Нацкаталог master-good id."}
        external_ref: {type: string, nullable: true, description: "Клиентская ссылка (1С)."}
        ntin_missing: {type: boolean, description: "true, если у товара есть barcode, но нет НТИН → не попадёт в фискальный чек как маркированный. Notify-only: дорезолвите НТИН через POST /catalog/scan + PATCH. Присутствует во всех ответах каталога."}
        matched_existing: {type: boolean, description: "Только в ответе POST /catalog: позиция сматчена с уже существующим товаром (match-and-merge) — вернулся его живой id, новая строка не создавалась. В остальных ответах — false."}
        name_differs: {type: boolean, description: "Только в ответе POST /catalog при matched_existing=true по ярусу 3 (совпал barcode/НТИН, но наименование другое): имя существующего товара НЕ перезаписано. Правьте имя явным PATCH /catalog/{id}."}
        status:
          type: string
          enum: [active, pending, deleting, deleted, failed]
          example: active
          description: >-
            `pending` — заведена у нас, ждёт отправки в Kaspi; `active` — продаётся;
            `deleting` — снятие запланировано или выполняется, продавать позицию уже нельзя;
            `deleted` — снята; `failed` — провести позицию не удалось: причина в полях
            `error_code`/`error_message` самой позиции, ошибки заливки дополнительно
            доступны через `GET /catalog/errors` (окно по умолчанию — 7 дней).
            ⛔ Позиция в `deleting` НЕ принимается в корзину ни на одной платёжной
            поверхности — см. `CartItem.catalog_item_id`. Она восстановима: пришлите её
            обычным `POST /catalog`, и удаление отменится.
        error_message: {type: string, nullable: true}
        error_code: {$ref: '#/components/schemas/ErrorCode'}
        created_at: {type: string, format: date-time}
        synced_at: {type: string, format: date-time, description: "= updated_at."}
    RejectedCatalogItem:
      type: object
      description: |
        Позиция POST /catalog, не прошедшая per-item валидацию. Возвращается в массиве
        `rejected[]` ответа (`202`/`201`), не роняя запрос. Валидные позиции того же батча
        обрабатываются штатно (`data[]`).
      required: [index, error_code, error_message]
      properties:
        index: {type: integer, description: "Позиция в исходном массиве items (0-based).", example: 2}
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        error_message: {type: string, description: "Человекочитаемое «что случилось → что сделать».", example: "Позиция не прошла валидацию: The selling price must be at least 0.01. Исправьте указанные поля и отправьте позицию повторно."}
        errors:
          type: object
          nullable: true
          description: "Карта поле → сообщения (только для error_code=catalog_item_invalid). Для barcode_too_long отсутствует."
          additionalProperties: {type: array, items: {type: string}}
        name: {type: string, nullable: true, description: "Echo name из исходной позиции (если был)."}
        barcode: {type: string, nullable: true, description: "Echo barcode из исходной позиции (если был)."}
        external_ref: {type: string, nullable: true, description: "Echo external_ref из исходной позиции (если был)."}
    CreateSubscriptionRequest:
      type: object
      required: [phone_number, billing_period]
      properties:
        phone_number: {type: string, pattern: '^8\d{10}$', example: "87001234567"}
        billing_period:
          type: string
          enum: [daily, weekly, biweekly, monthly, quarterly, yearly]
        amount:
          type: number
          minimum: 100
          maximum: 1000000
          description: Обязателен без каталога; на каталог-организации игнорируется (сумма из cart_items).
        billing_day: {type: integer, minimum: 1, maximum: 28}
        description: {type: string, maxLength: 255}
        subscriber_name: {type: string, maxLength: 255}
        external_subscriber_id: {type: string, maxLength: 255}
        started_at: {type: string, format: date, description: "По умолчанию сегодня."}
        max_retry_attempts: {type: integer, minimum: 1, maximum: 10}
        retry_interval_hours: {type: integer, minimum: 1, maximum: 168}
        grace_period_days: {type: integer, minimum: 1, maximum: 30}
        metadata: {type: object}
        cart_items:
          type: array
          minItems: 1
          maxItems: 100
          description: Обязателен для каталог-организаций; запрещён без каталога.
          items:
            $ref: '#/components/schemas/CartItemSimple'
        bill_immediately: {type: boolean, default: false}
    Subscription:
      type: object
      description: Подписка. Даты UTC +00:00.
      properties:
        id: {type: integer, example: 10}
        subscriber_name: {type: string, nullable: true, example: Иван Иванов}
        phone_number: {type: string, example: "87001234567"}
        external_subscriber_id: {type: string, nullable: true, example: CLIENT-001}
        amount: {type: string, example: "5000.00"}
        cart_items: {type: array, nullable: true, items: {type: object}}
        description: {type: string, nullable: true}
        billing_period: {type: string, example: monthly}
        billing_period_label: {type: string, example: Ежемесячно}
        billing_day: {type: integer, nullable: true, example: 1}
        billing_day_label: {type: string, nullable: true}
        status: {type: string, enum: [active, paused, cancelled, expired], example: active}
        status_label: {type: string, example: Активна}
        status_color: {type: string, example: green}
        started_at: {type: string, format: date-time, nullable: true}
        next_billing_at: {type: string, format: date-time, nullable: true}
        next_billing_in_days: {type: integer, nullable: true}
        next_billing_label: {type: string, nullable: true}
        paused_at: {type: string, format: date-time, nullable: true}
        cancelled_at: {type: string, format: date-time, nullable: true}
        failed_attempts: {type: integer, example: 0}
        max_retry_attempts: {type: integer, example: 3}
        retry_interval_hours: {type: integer, example: 24}
        grace_period_days: {type: integer, example: 3}
        in_grace_period: {type: boolean, example: false}
        is_sandbox: {type: boolean, example: false}
        metadata: {type: object, nullable: true}
        created_at: {type: string, format: date-time, example: "2026-01-10T12:00:00+00:00"}
        updated_at: {type: string, format: date-time}
    SubscriptionActionResponse:
      type: object
      properties:
        message: {type: string, example: Subscription paused}
        subscription:
          $ref: '#/components/schemas/Subscription'
    SubscriptionInvoice:
      type: object
      description: Счёт подписки — один расчётный период списания. Даты UTC +00:00.
      properties:
        id: {type: integer, example: 1}
        invoice_id: {type: integer, nullable: true, example: 42}
        billing_period_start: {type: string, format: date, example: "2026-02-01"}
        billing_period_end: {type: string, format: date, example: "2026-02-28"}
        billing_period_label: {type: string, example: "01.02.2026 — 28.02.2026"}
        amount: {type: string, nullable: true, example: "5000.00"}
        attempt_number: {type: integer, example: 1}
        status: {type: string, example: paid}
        status_label: {type: string, example: Оплачен}
        status_color: {type: string, example: green}
        paid_at: {type: string, format: date-time, nullable: true}
        failure_reason: {type: string, nullable: true}
        invoice:
          type: object
          description: Присутствует, если связанный счёт существует.
          properties:
            id: {type: integer, example: 42}
            kaspi_invoice_id: {type: string, nullable: true}
            status: {type: string, example: paid}
        created_at: {type: string, format: date-time}
    WebhookInvoiceObject:
      type: object
      description: Объект invoice в вебхуке invoice.status_changed. Условные поля — только если non-null.
      properties:
        id: {type: integer, example: 123}
        external_order_id: {type: string, nullable: true}
        amount: {type: string, example: "1000.00"}
        status: {$ref: '#/components/schemas/InvoiceStatus'}
        description: {type: string, nullable: true}
        kaspi_invoice_id: {type: string, nullable: true}
        client_name: {type: string, nullable: true}
        client_phone: {type: string, nullable: true, description: "null для QR-счетов без номера."}
        is_sandbox: {type: boolean}
        internal_comment: {type: string, description: "Внутренняя заметка мерчанта. Только если non-null."}
        kaspi_source_type: {type: string, enum: [GOLD, RED, LOAN, BUSINESSACCOUNT, BANKINTEGRATIONACCOUNT], description: "Только если non-null (обычно после оплаты)."}
        kaspi_sale_type: {type: string, enum: [Remote, QR, Static, Restaurant], description: "Только если non-null."}
        subtotal: {type: string, description: "Только со скидкой/корзиной (вместе с discount_sum)."}
        discount_sum: {type: string}
        discount_percentage: {type: integer, description: "Только если non-null."}
        paid_at: {type: string, format: date-time, description: "Только при status=paid."}
        cancelled_at: {type: string, format: date-time, description: "Только при status=cancelled."}
        expired_at: {type: string, format: date-time, description: "Только при status=expired."}
        errored_at: {type: string, format: date-time, description: "Только при status=error."}
        error_message: {type: string, nullable: true, description: "При status=error всегда (может быть null); при cancelled — только non-null."}
        error_code: {$ref: '#/components/schemas/ErrorCode'}
    WebhookInvoiceStatusChanged:
      type: object
      properties:
        event: {type: string, example: invoice.status_changed}
        invoice: {$ref: '#/components/schemas/WebhookInvoiceObject'}
        source: {type: string, nullable: true, description: "Имя API-ключа создателя."}
        timestamp: {type: string, format: date-time, example: "2026-06-11T10:30:00+00:00"}
    WebhookInvoiceQrScanned:
      type: object
      properties:
        event: {type: string, example: invoice.qr_scanned}
        invoice:
          type: object
          properties:
            id: {type: integer, example: 108565}
            external_order_id: {type: string, nullable: true}
            amount: {type: string, example: "1500.00"}
            status: {type: string, example: pending}
            qr_substate: {type: string, example: scanned}
            description: {type: string, nullable: true}
            kaspi_invoice_id: {type: string, nullable: true}
            client_name: {type: string, nullable: true}
            client_phone: {type: string, nullable: true}
            is_sandbox: {type: boolean}
            internal_comment: {type: string, description: "Внутренняя заметка мерчанта. Только если non-null."}
        source: {type: string, nullable: true}
        timestamp: {type: string, format: date-time}
