        - session_transient
        - client_not_found
        - kaspi_throttled
        - refund_window_expired
        - invoice_already_paid
        - invoice_already_cancelled
        - invoice_not_found_in_kaspi
        - amount_must_be_whole_tenge
        - qr_cancel_unsupported
        - catalog_requires_cart_items
        - catalog_not_supported
        - organization_not_configured
        - cart_items_mismatch
        - qr_render_failed
        - kaspi_session_invalid
        - kaspi_session_unavailable
        - kaspi_session_expired
        - tariff_inactive
        - custom_tariff_locked
        - invoices_disabled
        - entrance_auth_disabled
        - manager_throttled
        - whatsapp_otp_throttled
        - whatsapp_gateway_error
        - subscription_payment_failed
        - image_upload_failed
        - catalog_item_not_found
        - barcode_too_long
        - catalog_item_duplicate
        - catalog_match_overflow
        - catalog_item_invalid
        - idempotency_key_conflict
        - catalog_multi_tradepoint
        - catalog_delete_scope_required
        - catalog_delete_filter_invalid
        - catalog_delete_in_progress
        - catalog_delete_owner_key_required
        - catalog_busy
        - catalog_bulk_delete_mismatch
        - request_rate_limited
        - kaspi_error
        - unknown_error
        - outstanding_recipient_limit
        - outstanding_org_limit
        - recipient_fanout_exceeded
        - trial_daily_limit
        - tariff_limit_reached
        - content_rejected
        - kyc_daily_limit_reached
        - kyc_rejected
        - qr_refund_expired
        - qr_refund_not_identified
        - qr_refund_completed
        - operation_not_returnable
        - refund_amount_exceeds_available
        - cashbox_disabled
        - cashbox_kkm_unknown
        - cashbox_no_open_shift
        - cashbox_shift_already_closed
        - cashbox_shift_not_found
        - cashbox_operation_not_found
        - cashbox_duplicate_operation
        - cashbox_busy
        - cashbox_operation_failed
        - cashbox_unavailable
        - cashbox_report_unavailable
        - cashbox_toggle_in_progress
        - cashbox_toggle_unavailable
        - receipt_not_available_for_status
        - receipt_unavailable
        - receipt_rate_limited
    QrRefundSession:
      type: object
      description: Снимок сессии QR-возврата. Kaspi наружу не течёт (нет QrReturnId/ExtTranId).
      properties:
        id: {type: integer, example: 42}
        status: {type: string, enum: [awaiting_scan, customer_identified, completed, expired, failed]}
        client_name: {type: string, nullable: true, example: "Иван И."}
        qr_token_url: {type: string, nullable: true}
        qr_image_url: {type: string, nullable: true}
        expires_at: {type: string, format: date-time, nullable: true}
        identified_at: {type: string, format: date-time, nullable: true}
        completed_at: {type: string, format: date-time, nullable: true}
        refunded_amount: {type: string, nullable: true, example: "500.00"}
        receipt_url: {type: string, nullable: true}
        poll_interval_seconds: {type: integer, nullable: true, description: Только в ответе старта}
        scan_wait_timeout_seconds: {type: integer, nullable: true, description: Только в ответе старта}
    QrRefundOperation:
      type: object
      properties:
        ref: {type: string, description: Непрозрачный operation_ref (в details/execute)}
        amount: {type: number, example: 500}
        date: {type: string, format: date-time, nullable: true}
        returnable: {type: string, enum: [none, partial, full]}
        source_type: {type: string, nullable: true, example: GOLD}
        sale_type: {type: string, nullable: true, example: Remote}
        client_name: {type: string, nullable: true, example: "Иван И."}
    QrRefundOperationList:
      type: object
      properties:
        client_name: {type: string, nullable: true}
        operations: {type: array, items: {$ref: '#/components/schemas/QrRefundOperation'}}
        has_more: {type: boolean}
        next_cursor: {type: string, nullable: true}
        remaining_count: {type: integer}
    QrRefundOperationDetails:
      type: object
      properties:
        ref: {type: string}
        amount: {type: number}
        date: {type: string, format: date-time, nullable: true}
        returnable: {type: string, enum: [none, partial, full]}
        available_for_refund: {type: number, example: 500}
        already_refunded: {type: number, example: 0}
        receipt_url: {type: string, nullable: true}
        items:
          type: array
          items:
            type: object
            properties:
              ref: {type: string, description: "Непрозрачный item-ref (в execute.items[].ref)"}
              name: {type: string, nullable: true}
              price: {type: number}
              count: {type: number}
              available_for_refund: {type: number}
    ExecuteQrRefundRequest:
      type: object
      required: [operation_ref]
      properties:
        operation_ref: {type: string}
        amount: {type: number, nullable: true, description: Частичный возврат суммой (взаимоисключимо с items)}
        items:
          type: array
          nullable: true
          description: Частичный возврат по позициям (взаимоисключимо с amount)
          items:
            type: object
            required: [ref]
            properties:
              ref: {type: string}
              amount: {type: number, nullable: true, description: По умолчанию — вся доступная сумма позиции}
        simulate:
          type: object
          nullable: true
          description: |
            **Только песочница** (боевая → `403 not_sandbox`). Форсирует исход возврата.
          required: [status]
          properties:
            status: {type: string, enum: [completed, failed]}
            error_code:
              type: string
              nullable: true
              enum: [operation_not_returnable, refund_amount_exceeds_available, qr_refund_expired, kaspi_error]
    QrRefundExecuted:
      type: object
      properties:
        id: {type: integer}
        status: {type: string, example: completed}
        refunded_amount: {type: string, example: "500.00"}
        receipt_url: {type: string, nullable: true}
        client_name: {type: string, nullable: true}
        completed_at: {type: string, format: date-time, nullable: true}
    WebhookQrRefund:
      type: object
      description: Payload событий qr_refund.identified/completed/expired.
      properties:
        event: {type: string, enum: [qr_refund.identified, qr_refund.completed, qr_refund.expired]}
        qr_refund:
          type: object
          properties:
            id: {type: integer}
            status: {type: string, enum: [customer_identified, completed, expired]}
            client_name: {type: string, nullable: true, example: "Иван И."}
            expires_at: {type: string, format: date-time, nullable: true}
            refunded_amount: {type: string, nullable: true, description: Только при completed}
            receipt_url: {type: string, nullable: true, description: Только при completed}
            error_code: {$ref: '#/components/schemas/ErrorCode'}
            is_sandbox: {type: boolean}
        source: {type: string, nullable: true}
        timestamp: {type: string, format: date-time}
    InvoiceStatus:
      type: string
      description: "Статус счёта. Статуса refunded НЕ существует — полный возврат оставляет paid + is_fully_refunded=true."
      enum: [processing, pending, cancelling, paid, cancelled, expired, error, partially_refunded]
    PaginationLinks:
      type: object
      description: Ссылки пагинации (meta-обёртка).
      properties:
        first: {type: string, nullable: true}
        last: {type: string, nullable: true}
        prev: {type: string, nullable: true}
        next: {type: string, nullable: true}
    PaginationMeta:
      type: object
      description: |
        Метаданные пагинации (offset-режим). В keyset-режиме (`?cursor=`) вместо
        `total`/`from`/`to` приходят `next_cursor`/`prev_cursor`.
      properties:
        current_page: {type: integer, example: 1}
        from: {type: integer, nullable: true, example: 1}
        last_page: {type: integer, example: 2}
        path: {type: string}
        per_page: {type: integer, example: 50}
        to: {type: integer, nullable: true, example: 50}
        total: {type: integer, example: 75}
    CartItem:
      type: object
      description: Позиция корзины (счета/QR).
      required: [catalog_item_id, count]
      properties:
        catalog_item_id:
          type: integer
          description: >-
            ID товара из каталога (поле `id` из `GET /catalog`). Должен принадлежать
            организации, иметь цену и НЕ находиться в снятии.
            ⛔ Позиция в статусе `deleting` в корзину не принимается: при массовом
            удалении она стоит в этом статусе долго (порядок величин — в описании
            `POST /catalog/bulk-delete`), и счёт, выставленный в это окно, стал бы
            фискальным документом на товар, которого к моменту оплаты уже нет. Отказ приходит в
            `errors["cart_items.N.catalog_item_id"]` с текстом
            `Catalog item is being deleted. Send it again via POST /catalog to cancel the
            deletion and use it in invoices.` — позиция восстановима: пришлите её обычным
            `POST /catalog`, удаление отменится, и она снова станет доступна для счетов.
            Позиция в статусе `deleted` даёт отдельный текст (`Catalog item has been
            deleted.`).
            ⚠️ Форма отказа зависит от поверхности: `POST /invoices`, `/invoices/qr`,
            `/static-qr` и создание/обновление подписки отдают `422`, а `POST /invoices/bulk`
            остаётся `201` и возвращает позицию в `invoices[]` как `failed` с
            `error_code: catalog_item_not_found`.
        count:
          type: integer
          minimum: 1
        price:
          type: number
          nullable: true
          minimum: 0.01
          maximum: 99999999.99
          description: Кастомная цена за единицу (заменяет каталожную).
    CartItemSimple:
      type: object
      description: Позиция корзины для подписки (без кастомной цены).
      required: [catalog_item_id, count]
      properties:
        catalog_item_id:
          type: integer
          description: >-
            Те же правила, что у `CartItem.catalog_item_id`: позиция в статусе `deleting`
            в корзину не принимается (`422`).
            ⚠️ Асимметрия, важная для денег: гейт стоит на СОЗДАНИИ и ОБНОВЛЕНИИ подписки,
            а на очередном списании — нет. Если позиция уходит в снятие у уже работающей
            подписки, списание не проваливается, а ОТКЛАДЫВАЕТСЯ до следующей попытки
            списания: счётчик неудач не растёт и подписка не уходит в grace period. ⚠️ Наружу это никак
            не сигнализируется — ни счёта, ни вебхука, ни сдвига `next_billing_at`.
        count: {type: integer, minimum: 1}
    CreateInvoiceRequest:
      type: object
      required: [phone_number]
      properties:
        phone_number:
          type: string
          pattern: '^8\d{10}$'
          example: "87001234567"
        amount:
          type: number
          minimum: 1
          multipleOf: 1
          maximum: 99999999.99
          description: >-
            Сумма в тенге, только целая. Обязательна, если нет cart_items. Игнорируется при
            наличии cart_items — там проверяется итог корзины после скидок. Дробная сумма →
            `422 amount_must_be_whole_tenge`.
          example: 5000
        description:
          type: string
          maxLength: 500
        internal_comment:
          type: string
          maxLength: 255
          nullable: true
          description: |
            Внутренняя заметка мерчанта («кто это / что это»). **В Kaspi не передаётся,
            плательщик её не видит** и в чек она не попадает. Возвращается в `GET /invoices`,
            `GET /invoices/{id}`, в выгрузке кабинета и в вебхуках `invoice.status_changed`
            и `invoice.qr_scanned` (только если non-null). Ищется подстрокой через `search`.
            Редактируется после создания — `PATCH /invoices/{id}`, в любом статусе.
        external_order_id:
          type: string
          maxLength: 255
        external_order_id_idempotency:
          type: string
          maxLength: 191
          description: |
            Ключ идемпотентности (уникален в пределах организации). Дубль → 409. Исключение —
            перевыставление: если прежний счёт с этим ключом в статусе expired/cancelled/error,
            создаётся новый. Пусто/null → выключено.
        kaspi_connection_id:
          type: integer
          description: Кассир (default — primary). Обязателен, если >1 активной connection без primary (иначе 422 connection_ambiguous).
        cart_items:
          type: array
          minItems: 1
          maxItems: 100
          description: Корзина. Для этого эндпоинта необязательна и организации с каталогом — счёт можно выставить одной суммой в amount. Организация без каталога с cart_items получит 422.
          items:
            $ref: '#/components/schemas/CartItem'
        discount_percentage:
          type: number
          minimum: 1
          maximum: 99
          description: Глобальная скидка на весь чек (%).
    CreateQrInvoiceRequest:
      type: object
      description: Тело зависит от организации — amount (без каталога) либо cart_items (с каталогом).
      properties:
        amount:
          type: number
          minimum: 0.01
          maximum: 99999999.99
          example: 5000
        description:
          type: string
          maxLength: 100
          description: Наименование позиции в QR-чеке Kaspi (макс 100 — ограничение Kaspi).
        internal_comment:
          type: string
          maxLength: 255
          nullable: true
          description: |
            Внутренняя заметка мерчанта; в Kaspi не уходит и плательщику не видна.
            Ограничение `description` в 100 символов (лимит Kaspi на наименование позиции
            в чеке) на это поле **не распространяется** — потолок 255, как в `POST /invoices`.
        external_order_id:
          type: string
          maxLength: 255
        external_order_id_idempotency:
          type: string
          maxLength: 191
        kaspi_connection_id:
          type: integer
        simulate:
          type: string
          enum: [paid, cancelled, expired]
          description: Только sandbox — сразу перевести созданный QR-счёт в статус.
        cart_items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CartItem'
        discount_percentage:
          type: number
          minimum: 1
          maximum: 99
    BulkInvoiceItem:
      type: object
      description: Элемент пакетного создания (те же правила, что POST /invoices, но без kaspi_connection_id — он общий на пачку).
      required: [phone_number]
      properties:
        phone_number: {type: string, pattern: '^8\d{10}$', example: "87001234567"}
        amount: {type: number, nullable: true, minimum: 1, multipleOf: 1, maximum: 99999999.99, description: "Только целые тенге; дробная → позиция failed с amount_must_be_whole_tenge."}
        description: {type: string, maxLength: 500}
        internal_comment: {type: string, maxLength: 255, nullable: true, description: "Внутренняя заметка мерчанта; в Kaspi не уходит, плательщику не видна."}
        external_order_id: {type: string, maxLength: 255}
        external_order_id_idempotency: {type: string, maxLength: 191}
        cart_items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CartItem'
        discount_percentage: {type: number, minimum: 1, maximum: 99}
    UpdateInvoiceInternalCommentRequest:
      type: object
      required: [internal_comment]
      properties:
        internal_comment: {type: string, maxLength: 255, nullable: true, description: "Новая заметка. `null` или пустая строка стирают её. Ключ обязателен: тело без него → 422."}
    BulkInvoiceResult:
      type: object
      description: |
        Результат по одной позиции батча. Набор полей зависит от `status`:
        created → id/amount/external_order_id/phone; duplicate → invoice_id/existing_status;
        failed → error_code/message (напр. amount_or_cart_required, catalog_not_supported).
      properties:
        index: {type: integer, description: "Индекс позиции в исходном массиве.", example: 0}
        status: {type: string, enum: [created, duplicate, failed]}
        id: {type: integer, description: "Только status=created."}
        amount: {type: string, description: "Только status=created."}
        external_order_id: {type: string, nullable: true, description: "Только status=created."}
        phone: {type: string, description: "Только status=created."}
        invoice_id: {type: integer, description: "Только status=duplicate."}
        existing_status: {type: string, description: "Только status=duplicate."}
        error_code: {type: string, description: "Только status=failed."}
        message: {type: string, description: "Только status=failed."}
    InvoiceCreated:
      type: object
      description: Ответ на создание счёта (status=processing). Условные поля появляются только при наличии значения.
      properties:
        id: {type: integer, example: 42}
        amount: {type: string, example: "5000.00"}
        status: {type: string, example: processing}
        paid_at: {type: string, format: date-time, nullable: true, description: "null при создании."}
        phone: {type: string, example: "87001234567"}
        created_at: {type: string, format: date-time, example: "2026-01-10T12:00:00+00:00"}
        kaspi_source_type: {type: string, description: "Только если non-null."}
        kaspi_sale_type: {type: string, description: "Только если non-null."}
        subtotal: {type: string, description: "Только при наличии скидки/корзины (вместе с discount_sum)."}
        discount_sum: {type: string}
        discount_percentage: {type: string, description: "Только если передан."}
        error_message: {type: string, description: "Только при status=error."}
    QrInvoiceCreated:
      type: object
      properties:
        id: {type: integer, example: 1}
        amount: {type: string, example: "5000.00"}
        status: {type: string, example: pending}
        paid_at: {type: string, format: date-time, nullable: true}
        phone: {type: string, nullable: true, description: "null для QR-счёта без номера."}
        created_at: {type: string, format: date-time, example: "2026-01-10T12:00:00+00:00"}
        is_qr_token: {type: boolean, example: true}
        qr_token_url: {type: string, description: "Ссылка Kaspi для QR.", example: "https://qr.kaspi.kz/..."}
        qr_image_url: {type: string, nullable: true, description: "PNG QR на нашем хранилище. Живёт до `qr_expires_at + 60 сек`, дальше `404` — перевыпустите QR, а не перезагружайте картинку."}
        qr_expires_at: {type: string, format: date-time, description: "Крайний момент, когда QR ещё можно ОТСКАНИРОВАТЬ. Длительность окна задаёт Kaspi — считайте её из этого поля, не константой. Начатая до него оплата завершается и позже. Терминальный статус диктует Kaspi — ждите вебхук.", example: "2026-01-10T12:03:00+00:00"}
    CreateStaticQrRequest:
      type: object
      description: |
        Данные будущего счёта. Укажите `amount` **либо** `cart_items` (для мерчантов с
        каталогом — `cart_items`). `description` ≤ 100 символов (лимит Kaspi на имя позиции).
        Позиции каталога и `kaspi_connection_id` проверяются на принадлежность вашей
        организации **сразу** — до печати листа (`422`, см. операцию).
      properties:
        amount: {type: number, description: "Сумма сделки. Обязателен, если нет cart_items.", example: 5000}
        cart_items:
          type: array
          description: "Позиции из синхронизированного каталога (для мерчантов с каталогом)."
          items:
            type: object
            required: [catalog_item_id, count]
            properties:
              catalog_item_id: {type: integer, example: 42}
              count: {type: integer, minimum: 1, example: 1}
              price: {type: number, nullable: true, example: 5000}
        discount_percentage: {type: number, nullable: true, minimum: 1, maximum: 99}
        description: {type: string, maxLength: 100, nullable: true, example: "Заказ №1024"}
        external_order_id: {type: string, maxLength: 255, nullable: true, description: "Ссылка на сделку в вашей системе (придёт в вебхуке)."}
        single_use: {type: boolean, default: true, description: "true — одна сделка (замок «Оплачено» после оплаты)."}
        kaspi_connection_id: {type: integer, nullable: true, description: "Кассир/точка (по умолчанию primary)."}
        expires_at: {type: string, format: date-time, nullable: true, description: "Срок годности сделки (в будущем)."}
    StaticQrCreated:
      type: object
      properties:
        id: {type: integer, example: 10}
        token: {type: string, description: "Неугадываемый токен — кодируется в QR (в URL печатного листа).", example: "9f1c…"}
        short_code: {type: string, description: "8 символов для ручного ввода на qr.apipay.kz.", example: "K7M9P2Q4"}
        print_url: {type: string, description: "URL, зашитый в QR-код листа.", example: "https://qr.apipay.kz/9f1c…"}
        manual_url: {type: string, description: "Куда вводить short_code, если скан не сработал.", example: "https://qr.apipay.kz"}
        qr_image_url: {type: string, nullable: true, description: "Готовый PNG печатного QR (непротухающий)."}
        amount: {type: string, nullable: true, example: "5000.00"}
        description: {type: string, nullable: true}
        external_order_id: {type: string, nullable: true}
        single_use: {type: boolean, example: true}
        status: {type: string, enum: [active, paid, disabled], example: active}
        is_sandbox: {type: boolean, example: false}
        scan_count: {type: integer, example: 0}
