  "/catalog/units":
    get:
      tags: [Catalog]
      summary: Единицы измерения
      description: Список единиц измерения для товаров. Получите перед созданием товаров, чтобы использовать корректные unit_id.
      operationId: listCatalogUnits
      responses:
        '200':
          description: Единицы измерения
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer, example: 1}
                        name: {type: string, example: штука}
                        name_kaz: {type: string, example: дана}
        '401':
          $ref: '#/components/responses/Unauthorized'
  "/catalog":
    get:
      tags: [Catalog]
      summary: Список товаров каталога
      description: |
        Товары каталога. **Четыре режима чтения** (по приоритету):
        1. **targeted** — `ntins[]`/`barcodes[]`/`ids[]`/`external_refs[]` (OR, все статусы,
           суммарно ≤200 значений по 4 наборам) → форма `{data:[...]}` без пагинации
           (точечное подтверждение батча);
        2. **incremental** — `updated_after` → инкрементальный экспорт изменённого;
        3. **keyset** — `cursor` (курсорная пагинация без deep-offset, для экспорта 100k+);
        4. **default (offset)** — постранично `page`/`per_page`.

        **Статусы (default = active):** без параметра `statuses[]` ЛЮБОЙ режим отдаёт
        только `active`. Чтобы получить другие статусы (`pending`/`failed`/`deleting`/
        `deleted`) — передайте `statuses[]` явно (в т.ч. в incremental для зеркалирования
        удалений: `?updated_after=…&statuses[]=active&statuses[]=deleted`).

        **Призраки НЕ отдаются никогда:** строки `status='deleted'` с `kaspi_item_id=null`
        (позиции, отклонённые до отправки в Kaspi — их никогда не было в Kaspi) исключаются
        во всех режимах, даже при явном `?statuses[]=deleted`. Настоящие удаления
        (`deleted` с непустым `kaspi_item_id`) доступны через `?statuses[]=deleted`.

        **Лимиты targeted (явная ошибка вместо тихого усечения):** суммарное число значений
        по `ntins[]`+`barcodes[]`+`ids[]`+`external_refs[]` ≤200, и число найденных СТРОК
        соответствий ≤1000. Превышение любого → `422` с `error_code: catalog_match_overflow`.

        Режимы 2–4 отдают **meta-обёртку** `{data, links, meta}` (в keyset `meta` курсорная:
        `next_cursor`/`prev_cursor`, без `total`). Только для организаций с каталогом
        (иначе `400`/`404`). Даты — UTC `+00:00`.
      operationId: listCatalogItems
      parameters:
        - name: "statuses[]"
          in: query
          description: >-
            Фильтр по статусам товара. Не передан → отдаётся только `active`
            (default) во всех режимах. Призраки (`deleted` + пустой `kaspi_item_id`)
            не отдаются даже при `deleted`.
          schema:
            type: array
            items:
              type: string
              enum: [active, pending, deleting, deleted, failed]
        - name: "ntins[]"
          in: query
          description: "Targeted: НТИН'ы (≤200)."
          schema:
            type: array
            items: {type: string}
        - name: "barcodes[]"
          in: query
          description: "Targeted: штрихкоды (≤200)."
          schema:
            type: array
            items: {type: string}
        - name: "ids[]"
          in: query
          description: "Targeted: ID товаров (≤200)."
          schema:
            type: array
            items: {type: integer}
        - name: "external_refs[]"
          in: query
          description: "Targeted: клиентские ссылки external_ref (≤200)."
          schema:
            type: array
            items: {type: string}
        - name: updated_after
          in: query
          description: "Incremental: только изменённое после даты (вкл. удалённые)."
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: "Keyset: курсор пагинации (из meta.next_cursor)."
          schema:
            type: string
        - name: search
          in: query
          description: Поиск по названию.
          schema:
            type: string
        - name: barcode
          in: query
          description: Точный фильтр по штрихкоду.
          schema:
            type: string
        - name: first_char
          in: query
          description: Фильтр по первой букве названия.
          schema:
            type: string
        - name: without_ntin
          in: query
          description: >-
            `true` → только позиции без НТИН (`ntin` = null), независимо от наличия
            штрихкода — шире, чем поле ответа `ntin_missing` (то требует непустой
            `barcode`). Удобно считать «сколько осталось доделать» по `meta.total`.
            Компонуется со всеми режимами и фильтрами (`statuses[]`, `search` и т.д.).
          schema:
            type: boolean
            default: false
        - name: batch_id
          in: query
          description: "Фильтр по UUID батча bulk-приёма (last_batch_id). Компонуется со всеми режимами."
          schema:
            type: string
            format: uuid
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Товары каталога (форма зависит от режима)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          description: Каталог не включён для организации
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Верифицированная организация не найдена
        '422':
          description: >-
            Targeted-режим: суммарно значений >200 ИЛИ строк соответствий >1000.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, example: catalog_match_overflow}
                  error_code:
                    $ref: '#/components/schemas/ErrorCode'
                  message: {type: string, example: "Слишком много значений для точечного запроса: 250 (лимит 200 суммарно по ntins/barcodes/ids/external_refs). Разбейте запрос на несколько батчей и повторите."}
    post:
      tags: [Catalog]
      summary: Создать товары каталога
      description: |
        Создаёт 1–100 товаров пакетно. Sandbox → `201` (товар сразу активирован);
        Production → `202` (товар в статусе `pending`, синхронизация в Kaspi джобом).
        `external_ref` — клиентская ссылка (например код 1С) для последующего точечного
        чтения (`?external_refs[]=`).

        **Валидация per-item lenient.** Каждая позиция валидируется отдельно: валидные
        обрабатываются штатно (`data[]`), невалидные попадают в `rejected[]` (см. ниже) и
        НЕ роняют весь запрос. Одна битая позиция больше не даёт `422` на весь батч. `422`
        остаётся ТОЛЬКО за структурными ошибками ЗАПРОСА: `items` отсутствует / не массив /
        пуст / больше лимита (100). Ключ `rejected[]` присутствует в ответе ВСЕГДА (пустой
        `[]`, когда все позиции валидны). Если ВСЕ позиции невалидны — ответ всё равно
        успешный (`202`/`201`) с пустым `data[]` и полным `rejected[]`.

        **Match-and-merge работает и в sandbox** (тот же матчинг и маркеры), но синхронно и
        без обращения к Kaspi: matched-товар возвращается сразу активным, переиздание
        удалённого по `external_ref` активируется мгновенно (без фазы `pending`).

        **Match-and-merge (идемпотентная заливка).** Если позиция совпадает с уже
        существующим товаром, вместо дубля/ошибки возвращается ЖИВОЙ id существующего
        товара с маркером `matched_existing: true` (id стабилен). Ярусы матча (по
        приоритету): (1) совпал `external_ref` → полный update имени+цены + дозаполнение
        пустых `ntin`/`gtin`/`barcode`; (2) совпал `barcode` ИЛИ `ntin` И совпало имя →
        update цены + дозаполнение пустых; (3) совпал `barcode` ИЛИ `ntin`, но имя другое
        (например разные размеры под одним штрихкодом — Kaspi считает это одним товаром) →
        матч БЕЗ перезаписи имени/цены, маркер `name_differs: true` (правьте имя явным
        `PATCH /catalog/{id}`). `external_ref` существующего товара НИКОГДА не
        перетирается. Повторная заливка того же каталога идемпотентна: все позиции
        вернутся `matched_existing: true`, новые строки не создаются. Дозаполненные поля
        уезжают в Kaspi асинхронно. **Используйте `external_ref` как ключ маппинга** (не
        barcode/имя): на один barcode у мерчанта может быть несколько товаров.

        **Переиздание удалённого / статусы матча по `external_ref`:** если `external_ref`
        указывает на удалённый (`deleted`) товар — он автоматически переиздаётся: ТА ЖЕ
        строка (тот же `id`) возвращается в `pending` с полями из запроса и заново
        отправляется в Kaspi (`matched_existing: true`, `status: pending`). Если
        `external_ref` указывает на `failed`-товар — возвращается его текущая строка со
        `status: failed` БЕЗ автоматического повтора: исправьте данные и переотправьте
        позицию через `PATCH /catalog/{id}` (для строки без `kaspi_item_id` PATCH сам
        переотправляет создание) либо кнопкой «Повторить» в кабинете.
      operationId: createCatalogItems
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Ключ идемпотентности bulk-приёма (≤191). Повторный POST с тем же ключом той же
            организации возвращает СУЩЕСТВУЮЩИЙ батч (HTTP 200) без пересоздания позиций.
            Альтернатива — body-поле `idempotency_key`. Значимо только на инжест-пути
            (`batch` в ответе).
          schema:
            type: string
            maxLength: 191
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                idempotency_key:
                  type: string
                  maxLength: 191
                  nullable: true
                  description: >-
                    Ключ идемпотентности (эквивалент заголовка Idempotency-Key). Повтор → тот же батч (200).
                    ⚠️ Пространство ключей ОБЩЕЕ с массовым удалением: ключ, уже занятый операцией
                    другого типа, отдаёт `409 idempotency_key_conflict`.
                sync_token:
                  type: string
                  maxLength: 64
                  pattern: '^[A-Za-z0-9._:-]+$'
                  description: >-
                    Метка прогона полной синхронизации. Проставляется на КАЖДУЮ упомянутую позицию —
                    включая те, по которым работы не было (совпадение с каталогом Kaspi). Нужна, чтобы
                    потом удалить остаток «всё, чего в этой заливке не было». Заливка из нескольких
                    запросов шлёт один и тот же токен во всех.
                    ⚠️ Повтор с тем же `idempotency_key` токен НЕ обновляет — берите точку отсчёта
                    ДО первого запроса прогона.
                    ⛔ Не заменяйте это фильтром по времени изменения: `updated_at` не двигается у
                    позиций, совпавших с каталогом, и двигается у тронутых синхронизацией — фильтр по
                    времени удалил бы живое и пощадил мёртвое.
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [name, selling_price, unit_id]
                    properties:
                      name: {type: string, maxLength: 255, example: Coffee Latte}
                      selling_price: {type: number, minimum: 0.01, example: 1800}
                      unit_id: {type: integer, example: 1}
                      image_id: {type: string, format: uuid, nullable: true, description: "ID изображения из upload-image (exists)."}
                      barcode: {type: string, nullable: true, maxLength: 32}
                      ntin: {type: string, nullable: true, maxLength: 50, description: "НТИН кандидата Нацкаталога (из POST /catalog/scan)."}
                      gtin: {type: string, nullable: true, maxLength: 50, description: "GTIN кандидата Нацкаталога (GS1)."}
                      external_ref: {type: string, nullable: true, maxLength: 191, description: "Клиентская ссылка (1С)."}
                      from_catalog: {type: boolean, nullable: true, default: false}
      responses:
        '200':
          description: "Idempotency-Key повтор: возвращён существующий батч (позиции не пересозданы)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogItem'}
                  rejected:
                    type: array
                    items: {$ref: '#/components/schemas/RejectedCatalogItem'}
                  batch: {$ref: '#/components/schemas/CatalogBatch'}
        '201':
          description: "Sandbox: валидные товары созданы и активированы (невалидные — в rejected[])"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogItem'}
                  rejected:
                    type: array
                    description: "Позиции, не прошедшие per-item валидацию (присутствует всегда, может быть пустым)."
                    items: {$ref: '#/components/schemas/RejectedCatalogItem'}
        '202':
          description: "Production: валидные товары созданы со статусом pending (невалидные — в rejected[]), синхронизация запланирована"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogItem'}
                  rejected:
                    type: array
                    description: "Позиции, не прошедшие per-item валидацию (присутствует всегда, может быть пустым)."
                    items: {$ref: '#/components/schemas/RejectedCatalogItem'}
                  batch:
                    allOf: [{$ref: '#/components/schemas/CatalogBatch'}]
                    description: "Присутствует ТОЛЬКО на инжест-пути (per-item очередь включена). Прогресс батча + poll_url; итог — вебхук catalog.batch_processed."
        '400':
          description: Лимит каталога в тестовом режиме (sandbox) превышен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                sandbox_catalog_limit:
                  value: {error: "sandbox_catalog_limit", message: "Лимит каталога в тестовом режиме — 1000 позиций. Для большего каталога подключите платный тариф."}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TariffInactive'
        '409':
          description: |
            `catalog_busy` — каталог занят другой операцией, повторите через несколько секунд.
            `idempotency_key_conflict` — этот `Idempotency-Key` уже занят операцией ДРУГОГО типа
            (например, массовым удалением): пространство ключей общее, поэтому чужой батч не
            отдаётся, возьмите новый ключ. Повторять с тем же ключом бесполезно.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, example: catalog_busy}
                  error_code: {$ref: '#/components/schemas/ErrorCode'}
                  message: {type: string, example: "Каталог занят другой операцией, повторите запрос через несколько секунд."}
              examples:
                catalog_busy:
                  value: {error: catalog_busy, message: "Каталог занят другой операцией, повторите запрос через несколько секунд."}
                idempotency_key_conflict:
                  value: {error: idempotency_key_conflict, error_code: idempotency_key_conflict, message: "Этот Idempotency-Key уже использован операцией другого типа. Возьмите новый ключ."}
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          description: Ошибка Kaspi API
        '503':
          description: Kaspi сессия истекла
  "/catalog/bulk-delete":
    post:
      tags: [Catalog]
      summary: Массовое удаление позиций каталога
      description: |
        Снимает с продажи много позиций одним запросом. **POST, а не DELETE** — тело у
        `DELETE` плохо поддержано HTTP-клиентами 1С.

        **Два взаимоисключающих режима** (ровно один, иначе `422`):
          * **список** — `ids[]` либо `external_refs[]` (оба ключа уникальны в пределах
            организации, поэтому одно значение = не больше одной позиции). Лимит значений —
            **200**, превышение → `422 catalog_match_overflow`.
            ⛔ `barcodes[]` не принимается: штрихкод не уникален, и одно значение могло бы
            снести сотни позиций. Штрихкоды — только через фильтр, где есть `dry_run`;
          * **фильтр** — `filter.sync_token_not`: «удали всё, чего не было в моей заливке».
            Обязателен `expected_count` — множество большое и необратимое.

        ⚠️ **Это фоновая операция на СУТКИ.** Позиции снимаются с продажи по одной, и во
        время массового удаления заливка каталога идёт медленнее — обе операции работают в
        одной очереди. Порядок величин: 500 позиций — около двух часов, несколько тысяч — около
        суток с небольшим; при параллельной заливке умножьте примерно вчетверо.
        Ответ `202` — это «принято в работу», а не «удалено»: следите
        за прогрессом по `poll_url`, итог придёт вебхуком `catalog.batch_processed`
        (`kind: delete`). ⛔ Не ставьте на этот запрос HTTP-таймаут в расчёте на завершение.

        ⚠️ **Позиции, попавшие в очередь снятия, перестают приниматься в корзину сразу** —
        включая уже напечатанные листы `POST /static-qr`, где эти позиции зашиты в
        `cart_items`. Скан такого листа не создаст счёт, пока позиция не вернётся в продажу,
        а переиздать напечатанный лист нельзя. Если под удаление попадают позиции из
        действующих листов, верните их через `POST /catalog` либо перевыпустите листы.

        **Рекомендуемый порядок полной синхронизации из 1С:**
        1. залейте актуальный каталог через `POST /catalog`, передавая один и тот же
           `sync_token` во всех запросах прогона;
        2. вызовите этот эндпоинт с `dry_run: true` — узнаете, сколько позиций попадёт под
           удаление, и увидите образец;
        3. повторите без `dry_run`, передав полученное число в `expected_count`;
        4. дождитесь вебхука либо опрашивайте `poll_url`.

        ⚠️ Позицию, попавшую в очередь удаления по ошибке, можно **вернуть**: пришлите её
        обычным `POST /catalog` — удаление отменится, и если товар ещё не снят в Kaspi, он
        просто останется на месте. Если снятие уже прошло, позиция заводится заново: по
        `external_ref` вернётся та же строка (тот же `id`), а у позиции без `external_ref`,
        штрихкода и НТИН в каталоге появится новая строка.

        ⛔ Два случая, когда возврат НЕ сработает:
        1. если у позиции нет `external_ref`, а её штрихкод совпадает с ДРУГИМ, живым товаром —
           присланная позиция сольётся с живым товаром, а приговорённая уйдёт по вашему плану.
           Возврат по `external_ref` однозначен всегда;
        2. если удаление именно этой позиции уже отправлено в Kaspi — придёт
           `catalog_delete_in_progress` (в `rejected[]` у `POST /catalog`, `409` у
           `PATCH /catalog/{id}`). Повторите через несколько секунд: если позиция снялась,
           она будет заведена заново.
      operationId: bulkDeleteCatalogItems
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, maxLength: 191}
          description: "Повтор с тем же ключом возвращает существующий батч (200), ничего не удаляя."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: {type: integer}
                  description: "Режим списка: id позиций из GET /catalog."
                external_refs:
                  type: array
                  items: {type: string, maxLength: 191}
                  description: "Режим списка: клиентские ссылки (1С)."
                filter:
                  type: object
                  description: "Режим фильтра."
                  properties:
                    sync_token_not:
                      type: string
                      maxLength: 64
                      pattern: '^[A-Za-z0-9._:-]+$'
                      description: >-
                        Удалить позиции, помеченные ДРУГИМ sync_token. Позиции без метки вовсе
                        (заведённые в кассе вручную, пришедшие из каталога Kaspi, залитые без
                        sync_token) под фильтр НЕ попадают — для них нужен явный
                        include_never_stamped.
                    include_never_stamped:
                      type: boolean
                      default: false
                      description: >-
                        Включить в удаление и позиции, не участвовавшие ни в одном прогоне.
                        Нужен не только в первый раз: такие позиции появляются постоянно —
                        добавленные в кассе вручную, пришедшие из каталога Kaspi, залитые без
                        sync_token.
                expected_count:
                  type: integer
                  description: "Обязателен в режиме фильтра. Возьмите из dry_run. Расхождение → 409."
                dry_run:
                  type: boolean
                  description: "true — только посчитать и показать образец, ничего не менять и не расходовать Idempotency-Key."
                idempotency_key: {type: string, maxLength: 191}
            examples:
              targeted:
                summary: Список идентификаторов
                value: {ids: [101, 102, 103]}
              full_sync:
                summary: Полная синхронизация из 1С
                value: {filter: {sync_token_not: "run-2026-08-13-A"}, expected_count: 6870}
      responses:
        '200':
          description: |
            Четыре РАЗНЫХ тела под одним кодом — различайте по наличию ключей:
            `dry_run: true` — разведка; `batch` без `queued` — повтор по `Idempotency-Key`;
            `queued: 0` — удалять нечего; `deleted` — песочница (удалено синхронно).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: DryRun
                    properties:
                      dry_run: {type: boolean, example: true}
                      would_delete: {type: integer, example: 412}
                      sample:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: integer}
                            external_ref: {type: string, nullable: true}
                            name: {type: string}
                      already_queued:
                        type: integer
                        description: "⚠️ Здесь ЧИСЛО (историческая форма). В остальных телах — массив id."
                      already_queued_count: {type: integer}
                  - type: object
                    title: IdempotentReplay
                    properties:
                      batch: {$ref: '#/components/schemas/CatalogBatch'}
                  - type: object
                    title: NothingToDelete
                    properties:
                      message: {type: string, example: Nothing to delete}
                      queued: {type: integer, example: 0}
                      already_queued: {type: array, items: {type: integer}}
                      already_queued_count: {type: integer}
                  - type: object
                    title: SandboxDeleted
                    properties:
                      message: {type: string, example: Catalog items deleted}
                      deleted: {type: integer}
                      already_queued: {type: array, items: {type: integer}}
                      already_queued_count: {type: integer}
                      batch: {$ref: '#/components/schemas/CatalogBatch'}
        '202':
          description: "Позиции приняты в очередь удаления"
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch: {$ref: '#/components/schemas/CatalogBatch'}
                  queued: {type: integer, example: 6870}
                  already_queued:
                    type: array
                    items: {type: integer}
                    description: "Позиции, которые уже стояли в очереди удаления — их не переклеймливаем."
        '400':
          description: |
            `catalog_not_supported` — у организации не включён каталог. ⚠️ Именно 400, а не 422:
            это предусловие организации, а не ошибка тела запроса.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, example: catalog_not_supported}
                  error_code: {$ref: '#/components/schemas/ErrorCode'}
                  message: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            `tariff_inactive` — тариф не активен.
            `catalog_delete_owner_key_required` — ключ выпущен не владельцем организации.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, example: catalog_delete_owner_key_required}
                  error_code: {$ref: '#/components/schemas/ErrorCode'}
                  message: {type: string}
        '404':
          description: |
            Организация не найдена либо не верифицирована. ⚠️ Тело исторически без
            `error_code`: `{"error": "Verified organization not found"}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, example: Verified organization not found}
        '429':
          $ref: '#/components/responses/RateLimitWindow'
        '409':
          description: |
            `catalog_bulk_delete_mismatch` — `expected_count` разошёлся с фактом (тело несёт
            `actual_count`), каталог изменился между разведкой и командой: повторите `dry_run`.
            `idempotency_key_conflict` — ключ занят операцией другого типа.
            `catalog_multi_tradepoint` — у организации несколько торговых точек.
            `catalog_busy` — каталог занят другой операцией, повторите через несколько секунд.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, example: catalog_bulk_delete_mismatch}
                  error_code: {$ref: '#/components/schemas/ErrorCode'}
                  message: {type: string}
                  expected_count: {type: integer, example: 6870}
                  actual_count: {type: integer, example: 6868}
        '422':
          description: |
            `catalog_delete_scope_required` — `reason: mode_required` (не задан ни один режим
            либо задано несколько) или `reason: expected_count_required` (в режиме фильтра нет
            `expected_count`).
            `catalog_delete_filter_invalid` — фильтру нельзя верить: `reason: token_never_used`
            (этим `sync_token` не отмечена ни одна позиция — обычно опечатка) либо
            `reason: coverage_too_low` (прогон пометил слишком малую часть каталога — похоже,
            заливка не завершилась; тело несёт `stamped` и `visible`). Во втором случае
            повторите прогон целиком и вызовите удаление снова.
            `catalog_match_overflow` — слишком много значений в списке.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, example: catalog_delete_scope_required}
                  error_code: {$ref: '#/components/schemas/ErrorCode'}
                  message: {type: string}
                  reason:
                    type: string
                    description: >-
                      Уточнение причины в пределах одного error_code. Список ОТКРЫТ —
                      неизвестное значение обрабатывайте общей веткой.
                    example: coverage_too_low
                  stamped:
                    type: integer
                    description: "Только при coverage_too_low: сколько позиций пометил прогон."
                  visible:
                    type: integer
                    description: "Только при coverage_too_low: сколько живых позиций в каталоге."
  "/catalog/upload-image":
    post:
      tags: [Catalog]
      summary: Загрузить изображение товара
      description: |
        Загружает изображение товара. **Только JPEG и PNG**, максимум 6 МБ, стороны
        64…6000 px, площадь до 12 Мпикс.
        Тип определяется по содержимому файла, а не по имени и не по `Content-Type`:
        файл с расширением `.png`, но иным содержимым, отклоняется (`422 invalid_file_type`).

        Изображение **перекодируется на нашей стороне** (приводится к JPEG ≤512×512), поэтому
        байты на выходе не совпадают с загруженными. Дедупликация — по MD5 **результата**,
        внутри организации: повторная загрузка того же изображения вернёт прежний `image_id`.

        ⚠️ Для изображений, загруженных до 01.08.2026, дедуп мог считаться по исходному файлу.
        Повторная загрузка такого файла один раз не совпадёт и создаст новый `image_id`; прежний
        продолжает работать, чистить ничего не нужно. Дедупликацию не стоит считать контрактом:
        при обновлении обработчика изображений хеш может однократно измениться.

        Лимиты: **60/мин + 2000/сутки** на ключ.

        ⚠️ Ранее принимались также gif/webp/bmp/svg — сужено 01.08.2026 (см. changelog).
      operationId: uploadCatalogImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: "Файл изображения: JPEG или PNG, макс 6144 KB (6 МБ), стороны 64…6000 px, площадь ≤12 Мпикс."
      responses:
        '200':
          description: Изображение загружено
          content:
            application/json:
              schema:
                type: object
                properties:
                  image_id: {type: string, format: uuid}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TariffInactive'
        '413':
          description: "Файл больше 6 МБ (`error_code: file_too_large`). Повтор без уменьшения файла бессмысленен."
        '422':
          description: |
            `invalid_file_type` — содержимое не JPEG/PNG; `image_rejected` — габариты вне
            допустимого (стороны 64…6000 px, площадь ≤12 Мпикс) либо файл повреждён;
            `validation_error` — поле `image` отсутствует.
        '429':
          description: "Превышен лимит загрузок (60/мин или 2000/сутки на ключ)."
        '500':
          description: |
            `image_processing_unavailable` — обработка изображений временно недоступна,
            повторите позже. Изображение при этом **не сохранено** — `image_id` не выдан,
            повторять запрос безопасно.

  "/catalog/scan":
    post:
      tags: [Catalog]
      summary: Поиск товара в Нацкаталоге по штрихкоду
      description: |
        Резолвит штрихкод в Нацкаталоге Kaspi (синхронно, на сессии кассира). Один штрихкод
        может вернуть несколько кандидатов (общий gtin, разные ntin). Пустой `data[]` и/или
        `scan_result.code != "ok"` = товар не найден (**это не ошибка**, `200`; создавайте
        товар обычным путём без ntin/gtin). Лимиты: **30/мин + 2000/сутки** на ключ.
        При троттле Kaspi возвращается `429 kaspi_throttled`. Дождитесь времени из
        `retry_after_seconds` (заголовок `Retry-After`) и повторите.
      operationId: scanCatalogBarcode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:
                  type: string
                  maxLength: 64
                  description: Штрихкод (ручной ввод или сканер).
                  example: "4607015232646"
      responses:
        '200':
          description: Результат резолва (пустой data[] = не найдено, не ошибка)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer, example: 1118196}
                        name: {type: string, example: ВАФЛИ ЯШКИНО ОРЕХОВЫЕ 300Г}
                        ntin: {type: string, nullable: true, example: "0200009461097"}
                        gtin: {type: string, nullable: true, example: "4607015232646"}
                        barcode: {type: string, nullable: true, example: "4607015232646"}
                        unit_id: {type: integer, nullable: true}
                        image_link: {type: string, nullable: true}
                  normalized_barcode: {type: string, example: "4607015232646"}
                  scan_result:
                    type: object
                    properties:
                      code: {type: string, example: ok}
                      message: {type: string, nullable: true}
        '400':
          description: kaspi_session_expired — сессия кассира истекла, нужна переавторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TariffInactive'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: kaspi_throttled — Kaspi троттлит сессию. Тело содержит retry_after_seconds, заголовок Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: kaspi_scan_unavailable — Нацкаталог временно недоступен, повторите позже
  "/catalog/{id}":
    patch:
      tags: [Catalog]
      summary: Обновить товар каталога
      description: |
        Обновляет товар. Все поля опциональны — применяются только присланные (`filled`).
        `external_ref` при обновлении **не принимается**. ⚠️ `ntin`/`gtin` затирают
        идентичность Нацкаталога безвозвратно (её нельзя восстановить синком) — отправляйте
        только при реальном изменении. Sandbox → `200`, Production → `202`.

        ⚠️ **`PATCH` по позиции в очереди удаления ОТМЕНЯЕТ удаление** — запрос означает
        «позиция мне нужна» и обрабатывается так же, как повторная заливка. Исключение —
        узкое окно, когда снятие уже отправлено в Kaspi: тогда приходит
        `409 catalog_delete_in_progress`, состояние позиции при этом не меняется.
        Повторите через несколько секунд; если попытка снятия не завершилась, окно
        закрывается само не позже чем через две минуты — дольше этого кода не бывает.

        ⛔ **Если позиция к этому моменту уже снята, `PATCH` по ней вернёт `404`:** выборка
        идёт только по живым строкам, и снятая позиция для неё не существует. Заведите её
        заново обычным `POST /catalog`: по `external_ref` вернётся та же строка (тот же
        `id`); у позиции без `external_ref` в каталоге появится новая строка с новым `id`,
        а если её штрихкод совпадает с другим живым товаром — присланная позиция сольётся
        с ним. Пересоздание есть только у `POST /catalog`, у `PATCH` его нет.
      operationId: updateCatalogItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 255}
                selling_price: {type: number, minimum: 0.01}
                unit_id: {type: integer}
                image_id: {type: string, format: uuid, description: "Новый ID изображения (exists)."}
                is_image_deleted: {type: boolean, description: "true — удалить изображение."}
                barcode: {type: string, nullable: true, maxLength: 32}
                ntin: {type: string, maxLength: 50, description: "⚠️ Затирает идентичность Нацкаталога — только при реальном изменении."}
                gtin: {type: string, maxLength: 50, description: "⚠️ То же предупреждение, что и для ntin."}
                sync_token:
                  type: string
                  maxLength: 64
                  pattern: '^[A-Za-z0-9._:-]+$'
                  description: >-
                    Та же метка прогона, что у POST /catalog. Нужна, если позицию вы ведёте ТОЛЬКО
                    через PATCH: без неё она будет считаться неупомянутой в прогоне и попадёт под
                    удаление остатка. Проставляется независимо от того, менялись ли поля.
      responses:
        '200':
          description: "Sandbox: товар обновлён синхронно"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string, example: Catalog item updated}
                  catalog_item_id: {type: integer}
        '202':
          description: "Production: обновление поставлено в очередь"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string, example: Catalog item update queued}
                  catalog_item_id: {type: integer}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TariffInactive'
        '404':
          description: |
            Товар не найден. ⚠️ Сюда же приходит уже СНЯТАЯ позиция (`deleted`): выборка
            идёт по живым строкам. Заводите её заново через `POST /catalog`.
        '409':
          description: |
            `catalog_delete_in_progress` — снятие этой позиции уже отправлено в Kaspi,
            отменить его нельзя. Состояние позиции не изменено. Повторите через несколько
            секунд: если к тому моменту позиция снялась, `PATCH` вернёт `404` и заводить её
            нужно через `POST /catalog`. Окно живёт не дольше двух минут даже если попытка
            снятия не завершилась.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, example: catalog_delete_in_progress}
                  error_code: {$ref: '#/components/schemas/ErrorCode'}
                  message: {type: string}
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          description: Ошибка Kaspi API
        '503':
          description: Kaspi сессия истекла
    delete:
      tags: [Catalog]
      summary: Удалить товар каталога
      description: |
        Sandbox → `200` (hard delete). Production → `202`: статус позиции становится
        `deleting`, а в Kaspi она снимается фоновой обработкой.

        ⚠️ **Ответ приходит раньше, чем товар исчезает из кассы.** Обычно позиция снимается
        за считаные секунды, но если параллельно идёт массовая операция с каталогом, очередь
        загружена и снятие займёт дольше. Проверяйте результат чтением `GET /catalog?statuses[]=deleted`, а не сразу
        после ответа.

        ⚠️ Позиция остаётся в `deleting` и после временного сбоя — сервис вернётся к ней
        сам, повторный запрос слать не нужно.
      operationId: deleteCatalogItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Sandbox: товар удалён синхронно"
        '202':
          description: "Production: удаление поставлено в очередь"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string, example: Catalog item deletion queued}
                  catalog_item_id: {type: integer}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TariffInactive'
        '404':
          description: Товар не найден
        '409':
          description: |
            `catalog_multi_tradepoint` — у организации несколько торговых точек, и удаление
            каталога через API для неё недоступно. Обратитесь в поддержку.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, example: catalog_multi_tradepoint}
                  error_code: {$ref: '#/components/schemas/ErrorCode'}
                  message: {type: string, example: "У организации несколько торговых точек — удаление каталога недоступно. Обратитесь в поддержку."}
  "/clients/check":
    post:
      tags: [Clients]
      summary: Проверить номер в Kaspi
      description: |
        Проверяет, зарегистрирован ли номер в Kaspi, и возвращает имя клиента в формате
        Kaspi «Имя Ф.» (полная фамилия не отдаётся). Удобно перед созданием счёта/подписки.

        Номер нормализуется к `8XXXXXXXXXX` (77.../87.../+77... с пробелами/дефисами).

        **Лимиты:** 60/мин + 10 000/сутки на ключ; 200/мин + 20 000/сутки на организацию;
        10/мин на одного кассира. При троттле Kaspi — `429 scope=kaspi_throttle`.
        Дождитесь времени из `retry_after_seconds` (заголовок `Retry-After`) и повторите.

        ⚠️ **Запрещён массовый перебор** (enumeration). При злоупотреблении ключ
        деактивируется без предупреждения.
        Sandbox: `87770000001` → true/"Иван И.", `87770000002` → false, иначе false.
      operationId: checkClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  maxLength: 32
                  description: Телефон клиента (после нормализации — 11 цифр).
                  example: "77001234567"
      responses:
        '200':
          description: Номер проверен
          content:
            application/json:
              schema:
                type: object
                properties:
                  phone: {type: string, description: "Нормализованный номер (8XXXXXXXXXX).", example: "87001234567"}
                  has_kaspi: {type: boolean, example: true}
                  client_name: {type: string, nullable: true, description: "Формат «Имя Ф.»; null если has_kaspi=false.", example: "Иван И."}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TariffInactive'
        '422':
          description: Телефон пустой или не нормализуется к 11 цифрам
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, example: Validation failed}
                  field: {type: string, example: phone}
                  message: {type: string, example: "Phone must be normalizable to 8XXXXXXXXXX (11 digits)."}
        '429':
          description: |
            Превышен лимит. Два РАЗНЫХ источника, тела похожи, но различаются полем `scope`:

            * **наш лимитер** — `scope` одно из `minute`, `day`, `org_minute`, `org_day`,
              `cashier_minute`; список открыт, неизвестное значение обрабатывайте общей веткой.
              ⚠️ Часть окон СУТОЧНЫЕ (`*_day`) — ориентируйтесь на `retry_after`, а не на
              «подожду минуту»;
            * **троттл Kaspi** — `scope: kaspi_throttle` (сработал circuit-breaker).

            Оба тела несут `retry_after` (секунды) и заголовок `Retry-After`.
            ⚠️ Поля `error_code` здесь нет намеренно: единый поминутный код сюда не подходит —
            окна разные.
          headers:
            Retry-After:
              description: Секунд до повторной попытки.
              schema: {type: integer}
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, example: Too many requests}
                  message: {type: string, example: "Lookup rate limit exceeded."}
                  retry_after: {type: integer, example: 42}
                  scope: {type: string, example: minute}
              examples:
                our_limiter:
                  value: {error: "Too many requests", message: "Lookup rate limit exceeded.", retry_after: 42, scope: "day"}
                kaspi_throttle:
                  value: {error: "Too many requests", message: "Lookup throttled, retry later.", retry_after: 120, scope: "kaspi_throttle"}
        '503':
          description: Kaspi session unavailable — нет активной сессии кассира
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, example: Kaspi session unavailable}
  "/subscriptions":
    get:
      tags: [Subscriptions]
      summary: Список подписок
      description: |
        Подписки организации. Пагинация — **meta-обёртка** `{data, links, meta}`
        (`meta.current_page`/`total`/`per_page`/`last_page`/`from`/`to`). Фильтры — точное
        совпадение (не LIKE). Сортировка фиксированная: `created_at DESC`. Даты — UTC `+00:00`.
      operationId: listSubscriptions
      parameters:
        - name: status
          in: query
          description: Точный фильтр по статусу.
          schema:
            type: string
            enum: [active, paused, cancelled, expired]
        - name: external_subscriber_id
          in: query
          schema:
            type: string
        - name: phone_number
          in: query
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Список подписок
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscription'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Subscriptions]
      summary: Создать подписку
      description: |
        Создаёт рекуррентную подписку. Правила суммы зависят от организации:
        **без каталога** — `amount` обязателен (100–1 000 000), `cart_items` запрещён;
        **с каталогом** — `cart_items` обязателен (сумма считается сервером), `amount` игнорируется.
        `bill_immediately=true` — первый счёт сразу; иначе по расписанию в `next_billing_at`.

        ⛔ **Сумма списания — только целые тенге.** Списание выставляется счётом на номер
        телефона, поэтому дробная сумма (и голая `amount`, и итог `cart_items` после скидок)
        уходит в статус `error` с `error_code: amount_must_be_whole_tenge` — вебхуком
        `invoice.status_changed`, и так при КАЖДОМ списании. Проверьте суммы действующих
        подписок и цены каталожных позиций, из которых считается итог.

        ⛔ **Позиция корзины в статусе `deleting` отбивается `422`** — здесь и в
        `PUT /subscriptions/{id}`; текст в `errors["cart_items.N.catalog_item_id"]`.
        ⚠️ На очередном СПИСАНИИ этого гейта нет: если позиция уходит в снятие у уже
        работающей подписки, списание не проваливается, а откладывается до следующей
        попытки списания — счётчик неудач не растёт и подписка не уходит в grace period
        из-за временного состояния. Верните позицию обычным `POST /catalog`.

        ⚠️ **Отложенное списание ничем не сигнализируется:** счёт за период не создаётся,
        вебхука нет, `next_billing_at` не двигается. Списание пройдёт автоматически первой
        же попыткой после того, как позиция вернётся в продажу — если деньги нужны раньше,
        верните позицию сами.
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Подписка создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string, example: Subscription created}
                  subscription:
                    $ref: '#/components/schemas/Subscription'
        '400':
          description: organization_required / sandbox_subscription_limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Организация не верифицирована; либо `tariff_inactive` — подписка мерчанта на
            ApiPay не активна (грейса нет, блок сразу после `expires_at`; тело несёт
            `expires_at`). Остановить уже существующую подписку (`pause`/`cancel`) можно
            и без действующего тарифа.
        '422':
          $ref: '#/components/responses/ValidationError'
  "/subscriptions/{id}":
    get:
      tags: [Subscriptions]
      summary: Получить подписку
      description: Подписка со статистикой (`stats`) и последним платежом (`last_payment`).
      operationId: getSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Данные подписки
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Subscription'
                  - type: object
                    properties:
                      last_payment:
                        type: object
                        nullable: true
                        properties:
                          amount: {type: string, example: "5000.00"}
                          paid_at: {type: string, format: date-time, nullable: true}
                          status: {type: string, example: paid}
                      stats:
                        type: object
                        properties:
                          total_payments: {type: integer, example: 6}
                          successful_payments: {type: integer, example: 5}
                          failed_payments: {type: integer, example: 0}
                          total_collected: {type: string, example: "25000.00"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Подписка не найдена
    put:
      tags: [Subscriptions]
      summary: Обновить подписку
      description: |
        Все поля опциональны. `cart_items` на не-каталог организации → `422`. При передаче
        `cart_items` сумма пересчитывается.

        ⛔ Позиция корзины в статусе `deleting` отбивается `422` так же, как при создании —
        текст в `errors["cart_items.N.catalog_item_id"]`.
      operationId: updateSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: {type: number, minimum: 100, maximum: 1000000}
                billing_day: {type: integer, minimum: 1, maximum: 28}
                description: {type: string, maxLength: 255}
                subscriber_name: {type: string, maxLength: 255}
                external_subscriber_id: {type: string, maxLength: 255}
                max_retry_attempts: {type: integer, minimum: 1, maximum: 10}
                retry_interval_hours: {type: integer, minimum: 1, maximum: 168}
                grace_period_days: {type: integer, minimum: 1, maximum: 30}
                metadata: {type: object}
                cart_items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/CartItemSimple'
      responses:
        '200':
          description: Подписка обновлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string, example: Subscription updated}
                  subscription: {$ref: '#/components/schemas/Subscription'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TariffInactive'
        '404':
          description: Подписка не найдена
        '422':
          $ref: '#/components/responses/ValidationError'
  "/subscriptions/{id}/pause":
    post:
      tags: [Subscriptions]
      summary: Приостановить подписку
      description: Приостанавливает active-подписку (останавливает биллинг).
      operationId: pauseSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Подписка приостановлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionActionResponse'
        '400':
          description: Нельзя приостановить (подписка не active)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Подписка не найдена
  "/subscriptions/{id}/resume":
    post:
      tags: [Subscriptions]
      summary: Возобновить подписку
      description: Возобновляет paused-подписку (next_billing_at пересчитывается от текущего момента, пропущенные периоды не доначисляются).
      operationId: resumeSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Подписка возобновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionActionResponse'
        '400':
          description: Нельзя возобновить (подписка не paused)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TariffInactive'
        '404':
          description: Подписка не найдена
  "/subscriptions/{id}/cancel":
    post:
      tags: [Subscriptions]
      summary: Отменить подписку
      description: Отменяет active/paused-подписку безвозвратно (реактивации нет — создавайте новую).
      operationId: cancelSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Подписка отменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionActionResponse'
        '400':
          description: Нельзя отменить (неверный статус)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Подписка не найдена
  "/subscriptions/{id}/invoices":
    get:
      tags: [Subscriptions]
      summary: Счета подписки
      description: |
        Счета, созданные подпиской. **Нестандартный конверт** `{data, meta}` — `meta`
        содержит `current_page`/`total`/`per_page` (без `last_page`). Даты — UTC `+00:00`.
      operationId: listSubscriptionInvoices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Счета подписки
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubscriptionInvoice'
                  meta:
                    type: object
                    properties:
                      current_page: {type: integer, example: 1}
                      total: {type: integer, example: 3}
                      per_page: {type: integer, example: 20}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Подписка не найдена
  "/subscriptions/{subscription}/simulate-invoice":
    post:
      tags: [Sandbox]
      summary: Создать sandbox-счёт подписки
      description: "**Только sandbox.** Создаёт один sandbox-счёт для активной sandbox-подписки и шлёт вебхук. Кулдаун 30 секунд."
      operationId: simulateSubscriptionInvoice
      parameters:
        - $ref: '#/components/parameters/SubscriptionPathId'
      responses:
        '201':
          description: Sandbox-счёт создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string, example: Sandbox invoice created for subscription}
                  invoice: {$ref: '#/components/schemas/Invoice'}
        '400':
          description: subscription_not_active / sandbox_invoice_limit / organization_required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: not_sandbox — только для sandbox-подписок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Подписка не найдена
        '429':
          description: rate_limited — не прошёл кулдаун 30с
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  "/subscriptions/{subscription}/start-simulation":
    post:
      tags: [Sandbox]
      summary: Запустить авто-симуляцию подписки
      description: "**Только sandbox.** Автогенерация sandbox-счетов с интервалом. Макс. 3 одновременных симуляции на организацию."
      operationId: startSubscriptionSimulation
      parameters:
        - $ref: '#/components/parameters/SubscriptionPathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interval_minutes]
              properties:
                interval_minutes: {type: integer, minimum: 1, maximum: 60}
                max_invoices: {type: integer, minimum: 1, maximum: 20, default: 5}
      responses:
        '200':
          description: Симуляция запущена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string, example: Simulation started}
                  subscription: {$ref: '#/components/schemas/Subscription'}
        '400':
          description: subscription_not_active / simulation_limit / organization_required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: not_sandbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Подписка не найдена
        '409':
          description: simulation_already_active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  "/subscriptions/{subscription}/stop-simulation":
    post:
      tags: [Sandbox]
      summary: Остановить авто-симуляцию подписки
      description: "**Только sandbox.** Останавливает авто-симуляцию."
      operationId: stopSubscriptionSimulation
      parameters:
        - $ref: '#/components/parameters/SubscriptionPathId'
      responses:
        '200':
          description: Симуляция остановлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string, example: Simulation stopped}
                  subscription: {$ref: '#/components/schemas/Subscription'}
        '400':
          description: simulation_not_active / organization_required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: not_sandbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Подписка не найдена
  "/cashbox/summary":
    get:
      tags: [Cashbox]
      summary: Сводка по наличным за день
      description: |
        Кассовая сводка по наличным за календарный день (зона Asia/Almaty). Данные
        читаются с кассы Kaspi и кэшируются примерно на 60 секунд. Все суммы — строки
        `"N.NN"` в тенге. Флаг `available_cashbox_actions=false` означает «Kaspi запретил операции
        на кассе» — на чтении не роняется, отдаётся в данных, чтобы UI выключил
        тумблеры/закрытие.
      operationId: getCashboxSummary
      parameters:
        - {name: date, in: query, required: false, schema: {type: string}, description: "`Y-m-d` или `Y-m-d H:i` (Almaty). По умолчанию — сегодня. Будущая дата → 422."}
        - {name: kaspi_connection_id, in: query, required: false, schema: {type: integer, nullable: true}, description: Касса; по умолчанию primary-коннекшн организации.}
      responses:
        '200':
          description: Сводка по наличным
          content: {application/json: {schema: {$ref: '#/components/schemas/CashboxDaySummary'}}}
        '400': {description: organization_required}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: "tariff_inactive / cashbox_disabled — кассовые операции для организации недоступны (в песочнице этот отказ не приходит)"}
        '409': {description: "kaspi_session_not_configured / rfo_missing"}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: "Превышен отдельный лимит кассовых запросов (30/мин)"}
        '503': {description: "cashbox_unavailable — касса Kaspi временно недоступна"}
  "/cashbox/reconciliation":
    get:
      tags: [Cashbox]
      summary: Сверка наших счетов с кассой Kaspi
      description: |
        Сверка по одной смене. Показывает ОБЕ цифры рядом — нашу выручку по счетам (`ours`:
        продажи, возвраты и их разность) и цифру кассы Kaspi (`kaspi`) — и структурные причины, по которым
        их **нельзя приравнять** (`discrepancies`). ⛔ Это НЕ доказательство равенства: касса
        Kaspi и счета ApiPay — разные леджеры (Kaspi видит в том числе наличные и офлайн-продажи,
        а наша половина — только оплаты по счетам ApiPay), а итог смены приходит единой суммой,
        где эти части не выделены. Поэтому разницу мы не вычисляем: в ответе только обе цифры и
        причины расхождения. Активной сессии кассира ручка не требует — она работает по смене,
        уже полученной через `GET /cashbox/shifts`. Смены, которую ещё не листали, для сверки
        не существует.
      operationId: getCashboxReconciliation
      parameters:
        - {name: shift_id, in: query, required: true, schema: {type: integer}, description: "kaspi_shift_id из GET /cashbox/shifts."}
        - {name: kaspi_connection_id, in: query, required: false, schema: {type: integer, nullable: true}}
      responses:
        '200':
          description: Результат сверки
          content: {application/json: {schema: {$ref: '#/components/schemas/CashboxReconciliation'}}}
        '400': {description: organization_required}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: tariff_inactive}
        '404': {description: "cashbox_shift_not_found — смена с таким id недоступна (не листали GET /cashbox/shifts). Организация без кассы Kaspi (ОФД) приходит сюда же: смен ей не отдаёт и сам листинг"}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: "Превышен отдельный лимит кассовых запросов (30/мин)"}
        '503': {description: cashbox_unavailable}
  "/cashbox/shifts":
    get:
      tags: [Cashbox]
      summary: Список кассовых смен
      description: |
        Смены за окно `[date_from..date_to]` (глубина ≤ 31 дня). Данные читаются с кассы
        Kaspi и кэшируются примерно на 60 секунд. Суммы — строки `"N.NN"`;
        `total_income_raw` — исходное форматирование Kaspi (`"89 000 ₸"`), только для показа.
      operationId: listCashboxShifts
      parameters:
        - {name: date_from, in: query, required: true, schema: {type: string}, description: "`Y-m-d`/`Y-m-d H:i` (Almaty)."}
        - {name: date_to, in: query, required: true, schema: {type: string}, description: "≥ date_from; окно ≤ 31 дня, иначе 422."}
        - {name: kaspi_connection_id, in: query, required: false, schema: {type: integer, nullable: true}}
      responses:
        '200':
          description: Список смен
          content: {application/json: {schema: {$ref: '#/components/schemas/CashboxShiftList'}}}
        '400': {description: organization_required}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: "tariff_inactive / cashbox_disabled"}
        '409': {description: "kaspi_session_not_configured / cashbox_kkm_unknown"}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: "Превышен отдельный лимит кассовых запросов (30/мин)"}
        '503': {description: cashbox_unavailable}
  "/cashbox/shifts/close":
    post:
      tags: [Cashbox]
      summary: Закрыть смену (async)
      description: |
        Ставит закрытие смены в очередь и сразу отвечает `202` со `status: pending`. Итог —
        через `GET /cashbox/operations/{id}` (поле `poll_url` в ответе) или вебхук
        `cashbox.shift_closed` / `cashbox.shift_close_failed`.

        **Идемпотентность:** `client_operation_id` уникален на организацию — повтор с тем же
        ключом даёт `409 cashbox_duplicate_operation` (с `operation_id`/`status` уже принятой
        операции). ⛔ Ключ **не освобождается даже у `failed`**: повторное закрытие безопасно,
        но повтор ТЕМ ЖЕ ключом — дубль; повторяйте
        закрытие **новым** `client_operation_id`. «Уже закрыта» трактуется как успех
        (`completed`) — целевое состояние достигнуто.
      operationId: closeCashboxShift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_operation_id, shift_number]
              properties:
                client_operation_id: {type: string, minLength: 8, maxLength: 191, pattern: '^[A-Za-z0-9._:-]+$', description: "Ключ идемпотентности (уникален на организацию)."}
                shift_number: {type: integer, description: "Номер смены Kaspi для закрытия."}
                kaspi_connection_id: {type: integer, nullable: true}
      responses:
        '202':
          description: Закрытие принято в обработку
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  status: {type: string, example: pending}
                  client_operation_id: {type: string}
                  poll_url: {type: string, description: "GET-адрес статуса операции (…/cashbox/operations/{id})."}
        '400': {description: organization_required}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: "tariff_inactive / cashbox_disabled"}
        '409': {description: "kaspi_session_not_configured / cashbox_kkm_unknown / cashbox_duplicate_operation"}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: "Превышен отдельный лимит кассовых запросов (30/мин)"}
  "/cashbox/operations/{id}":
    get:
      tags: [Cashbox]
      summary: Статус кассовой операции (поллинг)
      description: |
        Читает данные ApiPay, к кассе Kaspi не обращается: отдельный лимит кассовых
        запросов не расходует и остаётся доступной при неактивном тарифе — уже принятую
        операцию всегда можно довести до терминального статуса. Чужой `id` → `404`
        (scope по организации, non-enumeration). `resolution.safe_to_retry=true` только при
        `status=failed` — повторяйте закрытие новым `client_operation_id`.
      operationId: getCashboxOperation
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Статус операции
          content: {application/json: {schema: {$ref: '#/components/schemas/CashboxOperation'}}}
        '400': {description: organization_required}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: "cashbox_operation_not_found (в т.ч. чужой id)"}
  "/cashbox/shifts/{shift}/report":
    get:
      tags: [Cashbox]
      summary: Ссылка на PDF-отчёт по смене
      description: |
        Возвращает временную подписанную ссылку (`url`) на PDF-отчёт по смене и её срок
        (`expires_at`, TTL ~15 мин). Файл скачивается по этой ссылке напрямую, ключ API
        для скачивания не нужен.

        ⚠️ Ссылка сама по себе даёт доступ к отчёту: пока не истёк `expires_at`, файл
        скачает любой, кто её получил. Не публикуйте её, не кладите в логи и не передавайте
        по открытым каналам — при необходимости запросите новую.
      operationId: getCashboxShiftReport
      parameters:
        - {name: shift, in: path, required: true, schema: {type: integer}, description: "kaspi_shift_id."}
      responses:
        '200':
          description: Подписанная ссылка на отчёт
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: {type: string}
                  expires_at: {type: string, format: date-time}
        '400': {description: organization_required}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: "tariff_inactive / cashbox_disabled"}
        '409': {description: kaspi_session_not_configured}
        '429': {description: "Превышен отдельный лимит кассовых запросов (30/мин)"}
        '503': {description: "cashbox_report_unavailable — не удалось получить отчёт"}
  "/cashbox/settings":
    get:
      tags: [Cashbox]
      summary: Текущие тумблеры кассы
      description: |
        Сохранённое состояние обоих тумблеров. Значения tri-state: `null` = живое
        значение с кассы ещё не читали.
      operationId: getCashboxSettings
      responses:
        '200':
          description: Состояние тумблеров
          content:
            application/json:
              schema:
                type: object
                properties:
                  auto_close_shift: {type: boolean, nullable: true}
                  auto_withdrawal: {type: boolean, nullable: true}
                  kaspi_connection_id: {type: integer, nullable: true}
        '400': {description: organization_required}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: "access_denied (не-owner без API-ключа) / cashbox_disabled"}
  "/cashbox/settings/auto-close":
    put:
      tags: [Cashbox]
      summary: Тумблер автозакрытия смены
      description: |
        Синхронное переключение. Идемпотентно: если ЖИВОЕ значение в Kaspi уже равно
        запрошенному — `changed:false` без обращения к кассе. Доступен API-ключу; человеку без ключа
        (SPA) — только owner организации.
      operationId: setCashboxAutoClose
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CashboxToggleRequest'}
      responses:
        '200':
          description: Результат переключения
          content: {application/json: {schema: {$ref: '#/components/schemas/CashboxToggleResult'}}}
        '400': {description: organization_required}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: "access_denied / tariff_inactive / cashbox_disabled"}
        '409': {description: "kaspi_session_not_configured / rfo_missing"}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: "Превышен отдельный лимит кассовых запросов (30/мин)"}
        '503': {description: "cashbox_toggle_in_progress — переключение уже выполняется, повторите позже / cashbox_toggle_unavailable — текущее значение на кассе проверить не удалось, переключение не выполнено"}
  "/cashbox/settings/auto-withdrawal":
    put:
      tags: [Cashbox]
      summary: Тумблер автоизъятия наличных
      description: |
        Автоизъятие наличных после закрытия смены. Поведение идентично `auto-close`
        (синхронный write, лок, идемпотентность по живому значению, owner-only на SPA).
      operationId: setCashboxAutoWithdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CashboxToggleRequest'}
      responses:
        '200':
          description: Результат переключения
          content: {application/json: {schema: {$ref: '#/components/schemas/CashboxToggleResult'}}}
        '400': {description: organization_required}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: "access_denied / tariff_inactive / cashbox_disabled"}
        '409': {description: "kaspi_session_not_configured / rfo_missing"}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: "Превышен отдельный лимит кассовых запросов (30/мин)"}
        '503': {description: "cashbox_toggle_in_progress — переключение уже выполняется / cashbox_toggle_unavailable — текущее значение на кассе проверить не удалось"}
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API-ключ из личного кабинета ApiPay.kz.
  parameters:
    ConnectionId:
      name: connection
      in: path
      required: true
      description: ID кассира.
      schema:
        type: integer
    SubscriptionPathId:
      name: subscription
      in: path
      required: true
      description: ID подписки.
      schema:
        type: integer
  responses:
    Unauthorized:
      description: X-API-Key отсутствует или невалиден
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string, example: Invalid API key}
              message: {type: string, example: The provided API key is invalid or inactive}
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorBody'
    TariffInactive:
      description: |
        `tariff_inactive` — подписка мерчанта на ApiPay не активна, платные операции закрыты.
        Лечится оплатой тарифа в кабинете apipay.kz; грейс-периода нет — блокировка наступает
        сразу после `expires_at`. Состояние видно заранее в `GET /tariff` и
        `GET /account/health` → `tariff.status`. Чтение (`GET`) продолжает работать,
        закрываются только действия.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TariffInactiveResponse'
    KaspiSessionInvalid:
      description: Сессия Kaspi недействительна или истекла
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string, example: kaspi_session_invalid}
              message: {type: string, example: "Kaspi session is invalid or expired. Please contact support."}
    InvoiceCreationUnavailable:
      description: |
        Создание счёта временно недоступно. `error` / `error_code`:
        * `kaspi_session_invalid` — сессия кассира Kaspi истекла (переподключите кассира);
        * `invoices_disabled` — приём новых счетов приостановлен (технические работы). Счёт
          НЕ создан — повторите позже. Чтение счетов, отмена, возврат и статусы продолжают
          работать. Стоп может быть ТОЧЕЧНЫМ по кассиру: 503 отдаётся, если приостановлена
          запись через кассира, на которого адресован счёт (`kaspi_connection_id` — явный
          или primary по умолчанию); счета на других кассиров организации создаются штатно.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            kaspi_session_invalid:
              value: {error: kaspi_session_invalid, message: "Kaspi session is invalid or expired. Please contact support."}
            invoices_disabled:
              value: {error: invoices_disabled, error_code: invoices_disabled, message: "Invoice creation is temporarily unavailable due to maintenance. Please retry later."}
    EntranceAuthDisabled:
      description: |
        `entrance_auth_disabled` — подключение/переавторизация кассира временно недоступны
        (технические работы). Повторите позже; уже подключённые кассиры продолжают работать.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            entrance_auth_disabled:
              value: {error: entrance_auth_disabled, message: "Cashier connection is temporarily unavailable"}
    CashierAuthUnavailable:
      description: |
        `entrance_auth_disabled` — подключение кассира временно недоступно (техработы).
        `kaspi_busy` — Kaspi троттлит анти-абузом; сессия закрыта, после паузы нужен
        новый `init`. Отличается от `EntranceAuthDisabled` наличием второй причины —
        используется на шагах, где Kaspi может ответить троттлом (`send-phone`, `verify-otp`).
      headers:
        Retry-After:
          description: Секунд до повторной попытки (только для `kaspi_busy`).
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            entrance_auth_disabled:
              value: {error: entrance_auth_disabled, message: "Cashier connection is temporarily unavailable"}
            kaspi_busy:
              value: {error: kaspi_busy, message: "Kaspi is busy — retry shortly"}
    RateLimitCap:
      description: |
        Превышен антифрод/триал/тарифный лимит на создание счетов. `error_code` — один из
        `trial_daily_limit`, `tariff_limit_reached` (лимит оплаченного тарифа; `meta.mode`
        различает суточный потолок и бюджет 30-дневного блока), `outstanding_recipient_limit`,
        `outstanding_org_limit`, `recipient_fanout_exceeded`, `kyc_daily_limit_reached`
        (новый мерчант на проверке — 1 счёт/день до ручного одобрения).
      headers:
        Retry-After:
          description: Секунд до повторной попытки.
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string, example: outstanding_recipient_limit}
              error_code: {$ref: '#/components/schemas/ErrorCode'}
              message: {type: string, example: "Слишком много неоплаченных счетов на этот номер."}
              retry_after_seconds: {type: integer, example: 60}
              meta:
                type: object
                nullable: true
                description: >-
                  Присутствует у `tariff_limit_reached` и `kyc_daily_limit_reached`.
                  ⚠️ У `trial_daily_limit`, `outstanding_*` и `recipient_fanout_exceeded`
                  поля НЕТ — один компонент описывает две разные формы.
                properties:
                  mode: {type: string, enum: [daily, monthly], example: daily}
                  limit: {type: integer, example: 100}
                  used: {type: integer, example: 100}
                  reset_at: {type: string, format: date-time}
    RateLimitWindow:
      description: |
        Превышен ПОМИНУТНЫЙ лимит запросов (`error_code: request_rate_limited`).

        ⚠️ Поле `message` намеренно осталось прежним — `"Too Many Attempts."`: интеграции,
        разбиравшие строку, продолжают работать. Всё машиночитаемое добавлено рядом.

        ⚠️ `limit`/`X-RateLimit-Limit` — это бакет, где осталось меньше всего, а не лимит
        конкретной ручки (к запросу применяется несколько лимитеров сразу).
      headers:
        Retry-After:
          description: Секунд до повторной попытки.
          schema: {type: integer}
        X-RateLimit-Limit:
          description: Потолок самого дефицитного бакета этого запроса.
          schema: {type: integer}
        X-RateLimit-Remaining:
          description: Остаток в нём (на 429 — всегда 0).
          schema: {type: integer}
        X-RateLimit-Reset:
          description: Unix-время обнуления окна.
          schema: {type: integer}
      content:
        application/json:
          schema:
            type: object
            properties:
              message: {type: string, example: "Too Many Attempts."}
              error: {type: string, example: request_rate_limited}
              error_code: {$ref: '#/components/schemas/ErrorCode'}
              limit: {type: integer, example: 200}
              remaining: {type: integer, example: 0}
              reset_at: {type: string, format: date-time, nullable: true}
              retry_after_seconds: {type: integer, example: 37}
    KycRejected:
      description: |
        Мерчант отклонён на KYC-модерации — выставление счетов заблокировано полностью
        (`error_code=kyc_rejected`). Разблокировка — только вручную (обращение в поддержку).
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string, example: kyc_rejected}
              error_code: {$ref: '#/components/schemas/ErrorCode'}
              message: {type: string, example: "Выставление счетов ограничено. Обратитесь в поддержку."}
    CashierManagementDisabled:
      description: У ключа нет флага can_manage_cashiers
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string, example: cashier_management_disabled}
              message: {type: string, example: This API key cannot manage cashiers}
    ConnectionNotFound:
      description: Кассир не найден (или принадлежит другой организации — non-enumeration)
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string, example: Connection not found}
  schemas:
    ErrorResponse:
      type: object
      description: Конверт бизнес-ошибки.
      properties:
        error:
          type: string
          description: Slug причины (дублирует error_code для обратной совместимости).
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Человекочитаемое описание (может локализоваться — не парсить).
    ValidationErrorBody:
      type: object
      properties:
        message:
          type: string
          example: Validation failed
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            phone_number: ["Phone number must be in format 8XXXXXXXXXX (11 digits starting with 8)"]
    DuplicateIdempotencyResponse:
      type: object
      description: Дубль external_order_id_idempotency.
      properties:
        error: {type: string, example: duplicate_idempotency_key}
        message: {type: string, example: "Счёт с таким ключом идемпотентности уже создан"}
        invoice_id: {type: integer, example: 12345}
        status: {type: string, description: "Статус существующего счёта.", example: pending}
    SessionExpiredResponse:
      type: object
      description: |
        Сессия кассира Kaspi мертва — счёт/чек не создан. Отказ приходит синхронно. Лечится ТОЛЬКО
        переавторизацией кассира в кабинете apipay.kz — ретрай не поможет. Состояние видно
        заранее в `GET /account/health` → `connection.needs_reauth`.
      properties:
        error_code: {$ref: '#/components/schemas/ErrorCode'}
        message: {type: string, example: "Сессия кассира Kaspi истекла — переавторизуйте кассира в кабинете apipay.kz."}
    TariffInactiveResponse:
      type: object
      description: |
        Подписка мерчанта на ApiPay не активна — платные операции закрыты (счета, чеки,
        возвраты, отмены, каталог, подписки, lookup клиента, ручная синхронизация). Лечится
        оплатой тарифа в кабинете apipay.kz; **грейс-периода нет** — блокировка наступает
        сразу после `expires_at`. Состояние видно заранее в `GET /tariff` и
        `GET /account/health` → `tariff.status`.

        Чтение (`GET`) не блокируется, как и оплата тарифа, управление аккаунтом/ключами и
        переподключение кассира — иначе мерчант не смог бы разблокироваться.
      properties:
        success: {type: boolean, example: false}
        error: {type: string, example: tariff_inactive}
        error_code: {$ref: '#/components/schemas/ErrorCode'}
        message: {type: string, example: "Подписка на ApiPay не активна — продлите тариф в кабинете apipay.kz."}
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Дата окончания тарифа. `null` — тариф не заводился вовсе.

            ⚠️ Интерпретировать только вместе с `reason`: при `reason: cancelled` дата лежит
            в БУДУЩЕМ (подписку отозвали досрочно, срок не переписывали), и текст «истекла N
            дней назад» на ней даёт отрицательное N.
          example: "2026-07-19T15:01:00+00:00"
        reason:
          type: string
          nullable: true
          description: |
            Почему тариф неактивен:
            * `expired` — срок вышел (`expires_at` в прошлом);
            * `cancelled` — подписку отозвал администратор ApiPay (`expires_at` может быть в
              будущем);
            * `none` — тариф не заводился ни разу (`expires_at` = `null`).
          enum: [expired, cancelled, none]
          example: expired
    ErrorCode:
