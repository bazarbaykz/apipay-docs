          type: object
          properties:
            id: {type: integer, example: 55}
            amount: {type: string, example: "500.00"}
            status: {type: string, enum: [completed, failed]}
            kaspi_refund_id: {type: string, nullable: true}
            reason: {type: string, nullable: true}
            created_at: {type: string, format: date-time}
            items:
              type: array
              description: Только для позиционного возврата.
              items:
                type: object
                properties:
                  catalog_item_id: {type: integer}
                  name: {type: string}
                  price: {type: string}
                  count: {type: integer, description: "0 при возврате по сумме."}
                  amount: {type: string}
            error_code: {$ref: '#/components/schemas/ErrorCode'}
        invoice:
          type: object
          properties:
            id: {type: integer, example: 123}
            external_order_id: {type: string, nullable: true}
            amount: {type: string, example: "1000.00"}
            total_refunded: {type: string, example: "500.00"}
            available_for_refund: {type: number, description: "Число, не строка.", example: 500}
            is_fully_refunded: {type: boolean, example: false}
            status: {type: string, example: partially_refunded}
            kaspi_invoice_id: {type: string, nullable: true}
            is_sandbox: {type: boolean}
        source: {type: string, nullable: true}
        timestamp: {type: string, format: date-time}
    WebhookSubscriptionEvent:
      type: object
      description: |
        Базовый конверт subscription.* вебхуков. Для некоторых событий доп. поля мержатся
        В КОРЕНЬ (не вложены): payment_succeeded → invoice_id/amount/paid_at;
        payment_failed → invoice_id/amount/reason/attempt_number; grace_period_started →
        grace_period_days/expires_at.
      properties:
        event: {type: string, example: subscription.payment_failed}
        subscription:
          type: object
          properties:
            id: {type: integer, example: 10}
            external_subscriber_id: {type: string, nullable: true}
            phone_number: {type: string}
            subscriber_name: {type: string, nullable: true}
            amount: {type: string, example: "5000.00"}
            billing_period: {type: string, example: monthly}
            status: {type: string, example: active}
            next_billing_at: {type: string, format: date-time, nullable: true}
            failed_attempts: {type: integer, example: 2}
            in_grace_period: {type: boolean, example: false}
            is_sandbox: {type: boolean, example: false}
        source: {type: string, nullable: true}
        timestamp: {type: string, format: date-time}
    WebhookTest:
      type: object
      description: Тест-вебхук (фиктивный invoice-конверт со status=test).
      properties:
        event: {type: string, example: webhook.test}
        invoice:
          type: object
          properties:
            id: {type: integer, nullable: true, example: null}
            status: {type: string, example: test}
            external_order_id: {type: string, example: TEST-ORDER-123}
            amount: {type: string, example: "1000.00"}
            is_sandbox: {type: boolean, example: true}
            kaspi_source_type: {type: string, example: GOLD}
            kaspi_sale_type: {type: string, example: Remote}
        source: {type: string, nullable: true}
        timestamp: {type: string, format: date-time}
    CashboxDaySummary:
      type: object
      description: |
        Сводка по наличным за день (`GET /cashbox/summary`). Все суммы — строки `"N.NN"` тенге.
      properties:
        date: {type: string, example: "2026-08-10"}
        current_cash_balance: {type: string, nullable: true, example: "12500.00"}
        replenishment_sum: {type: string, nullable: true, example: "0.00"}
        withdrawal_sum: {type: string, nullable: true, example: "0.00"}
        sale_cash_amt: {type: string, nullable: true, example: "8900.00"}
        sale_return_cash_amt: {type: string, nullable: true, example: "0.00"}
        cash_amount_on_opening: {type: string, nullable: true, example: "3600.00"}
        sale_cash_cnt: {type: integer, nullable: true, example: 12}
        sale_return_cash_cnt: {type: integer, nullable: true, example: 0}
        auto_withdrawal: {type: boolean, nullable: true, example: false}
        available_cashbox_actions: {type: boolean, nullable: true, description: "false = Kaspi запретил кассовые операции на этой кассе (UI выключает тумблеры/закрытие).", example: true}
    CashboxShiftList:
      type: object
      description: Список смен за окно (`GET /cashbox/shifts`).
      properties:
        auto_close_shift: {type: boolean, example: false}
        shifts:
          type: array
          items:
            type: object
            properties:
              id: {type: integer, description: kaspi_shift_id, example: 5012}
              shift_number: {type: integer, example: 106}
              start_date: {type: string, nullable: true, example: "2026-08-10"}
              is_current: {type: boolean, example: true}
              total_income: {type: string, nullable: true, description: "Нормализованная сумма `\"N.NN\"`.", example: "89000.00"}
              total_income_raw: {type: string, nullable: true, description: "Исходное форматирование Kaspi — только для показа.", example: "89 000 ₸"}
              transactions_count: {type: integer, nullable: true, example: 12}
    CashboxReconciliation:
      type: object
      description: |
        Сверка наших счетов с кассой Kaspi по одной смене (`GET /cashbox/reconciliation`).
        ⛔ Показывает обе цифры и причины расхождения, но НЕ доказывает равенство и не
        считает разницу: итог смены — единая сумма, продажи наличными и продажи мимо ApiPay
        в ней не выделены, поэтому вычитать одну цифру из другой было бы неверно.
      properties:
        mode: {type: string, enum: [shift]}
        is_sandbox: {type: boolean, example: false}
        window:
          type: object
          properties:
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
            timezone: {type: string, example: "Asia/Almaty"}
            source: {type: string, enum: [shift]}
        ours:
          $ref: '#/components/schemas/CashboxInvoiceTotals'
        kaspi:
          type: object
          description: "Итог смены по данным кассы Kaspi — единая сумма, продажи наличными и продажи мимо ApiPay в ней не выделены."
          properties:
            available: {type: boolean, example: true}
            source: {type: string, enum: [shift]}
            shift_id: {type: integer}
            shift_number: {type: integer}
            total_income: {type: string, nullable: true, description: "Итог смены."}
            total_income_raw: {type: string, nullable: true}
            transactions_count: {type: integer, nullable: true}
            is_current: {type: boolean, nullable: true}
            non_cash_amount: {type: string, nullable: true, description: "Всегда null: итог смены не разделён на наличную и безналичную части.", example: null}
            snapshot:
              type: object
              properties:
                synced_at: {type: string, format: date-time, nullable: true}
                stale: {type: boolean, description: "Данные кассы получены больше 15 минут назад — обновите список смен."}
        discrepancies:
          type: array
          description: "Структурные причины, по которым цифры нельзя приравнять (не дефекты)."
          items:
            type: object
            properties:
              code: {type: string, enum: [shift_not_calendar_day, kaspi_income_includes_offline_sales, open_shift_moving_target, paid_at_timezone_boundary, invoices_without_connection, kaspi_snapshot_stale]}
              source: {type: string, enum: [kaspi, ours, window]}
              message: {type: string}
              amount: {type: string, nullable: true, description: "Всегда null — причина неквантифицируема из одной суммы Kaspi."}
              count: {type: integer, description: "Только у invoices_without_connection."}
    CashboxInvoiceTotals:
      type: object
      description: |
        НАША половина сверки — итоги по счетам за окно. Суммы — строки `"N.NN"`.
        Окно режется по `paid_at`, поэтому неоплаченных групп (отменённые, просроченные,
        в ожидании) здесь нет — у таких счетов даты оплаты не существует.
      properties:
        count: {type: integer}
        sales:
          type: object
          description: "Принятые деньги: paid + partially_refunded."
          properties:
            count: {type: integer}
            amount: {type: string, example: "89000.00"}
            refunded_later: {type: string, description: "Сколько из этих счетов вернули когда-либо (объясняет разницу, не прячет)."}
        refunds:
          type: object
          description: "Возвраты, СОВЕРШЁННЫЕ в этом окне (по времени операции). Без connection-фильтра — по всей организации."
          properties:
            count: {type: integer}
            amount: {type: string}
        net_amount: {type: string, description: "sales − refunds — «итого» из терминала.", example: "89000.00"}
        coverage:
          type: object
          properties:
            invoices_without_connection: {type: integer, description: "Строк окна с пустым kaspi_connection_id (выпадают из sales при фильтре по кассе)."}
        period:
          type: object
          properties:
            from: {type: string, nullable: true}
            to: {type: string, nullable: true}
            field: {type: string, example: paid_at}
    CashboxOperation:
      type: object
      description: Статус кассовой операции (`GET /cashbox/operations/{id}`).
      properties:
        id: {type: integer}
        status: {type: string, enum: [pending, sending, completed, failed]}
        operation_type: {type: string, example: close_shift}
        shift_number: {type: integer, nullable: true}
        error_code: {type: string, nullable: true, description: "Заполнен при failed (слаг cashbox_*)."}
        error_message: {type: string, nullable: true}
        resolution:
          type: object
          properties:
            safe_to_retry: {type: boolean, description: "true только при status=failed — повторяйте НОВЫМ client_operation_id."}
    CashboxToggleRequest:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
        kaspi_connection_id: {type: integer, nullable: true}
    CashboxToggleResult:
      type: object
      properties:
        changed: {type: boolean, description: "false = живое значение в Kaspi уже равнялось запрошенному (no-op)."}
        new_value: {type: boolean}
    WebhookCashboxEvent:
      type: object
      description: |
        Payload вебхуков cashbox.shift_closed / cashbox.shift_close_failed. Таймстамп UTC +00:00.
        Дедуп по `(event, operation.id)`. При failed — причина в `operation.error_code`.
      properties:
        event: {type: string, enum: [cashbox.shift_closed, cashbox.shift_close_failed], example: cashbox.shift_closed}
        operation:
          type: object
          properties:
            id: {type: integer, example: 812}
            operation_type: {type: string, example: close_shift}
            status: {type: string, enum: [completed, failed], example: completed}
            shift_number: {type: integer, nullable: true, example: 106}
            error_code: {type: string, nullable: true, description: "Только при close_failed (слаг cashbox_*).", example: null}
        timestamp: {type: string, format: date-time, example: "2026-08-10T16:25:43+00:00"}
x-webhooks:
  # Исходящие POST на webhook_url API-ключа. Заголовки: Content-Type: application/json,
  # User-Agent: Kaspi-Pay-API/1.0, X-Webhook-Signature: sha256=<hmac_sha256(raw_body, webhook_secret)>
  # (если задан секрет — верифицировать по СЫРОМУ телу). Таймауты 3с+5с. Успех = любой 2xx.
  # Ретраятся 5xx/429/сетевые (invoice/refund/subscription 11 попыток; sandbox invoice — 3).
  # Редиректы: 307/308 поддерживаются (повторяем тот же POST с тем же телом и подписью,
  # до 2 переходов). 301/302/303 НЕ поддерживаются — по ним клиент обязан сменить метод
  # на GET и потерять тело, поэтому это недоставка, без ретрая
  # (error_message: "redirect not followed: HTTP <код>; ..."). 304/305/306 редиректами
  # не считаются. Указывайте конечный https-адрес — http:// с 301 на https:// доставку сорвёт.
  # Все таймстампы — UTC +00:00. Дедуплицируйте по ключам, указанным в описаниях.
  invoice.status_changed:
    post:
      tags: [Webhooks]
      summary: Счёт сменил статус
      description: |
        Счёт перешёл в уведомляемый статус (`pending`/`paid`/`cancelled`/`expired`/`error`/
        `partially_refunded`). Технические `processing`/`cancelling` вебхуков не порождают.
        **Один вебхук на реальный переход** (на стороне сервиса стоит защита от повторной
        отправки), но дубли всё же
        возможны — дедуп по `(invoice.id, invoice.status)`. Легитимные «странные»
        последовательности (обрабатывайте!): `cancelled→paid`, `expired→paid` (оплата
        выиграла гонку), `error→pending` (реконсиляция), `paid→partially_refunded`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookInvoiceStatusChanged'
      responses:
        '200':
          description: Принято (отвечайте быстро, обрабатывайте асинхронно).
  invoice.qr_scanned:
    post:
      tags: [Webhooks]
      summary: QR-счёт отсканирован
      description: |
        Клиент отсканировал QR и на экране оплаты (`qr_substate: "scanned"`, `status`
        остаётся `pending`). Шлётся **один раз** на QR. Транзиентно: далее возможны и
        `paid`, и `cancelled` — UI должен уметь откатить «Ожидается».
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookInvoiceQrScanned'
      responses:
        '200':
          description: Принято.
  invoice.refunded:
    post:
      tags: [Webhooks]
      summary: Возврат обработан
      description: |
        Возврат завершён — `completed` (успех) или `failed` (неудача, причина в
        `refund.error_code`). Гейта идемпотентности НЕТ — дедуп по `(refund.id,
        refund.status)`. Полный возврат не меняет статус счёта (остаётся `paid`/
        `partially_refunded` + `is_fully_refunded=true`); первый частичный возврат
        дополнительно шлёт `invoice.status_changed (partially_refunded)`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookInvoiceRefunded'
      responses:
        '200':
          description: Принято.
  qr_refund.identified:
    post:
      tags: [Webhooks]
      summary: QR-возврат — клиент идентифицирован
      description: |
        Клиент отсканировал возвратный QR (сессия → `customer_identified`). Дальше можно
        читать `GET /qr-refunds/{id}/operations`. Шлётся один раз на переход. Дедуп по
        `(qr_refund.id, qr_refund.status)`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookQrRefund'
      responses:
        '200':
          description: Принято.
  qr_refund.completed:
    post:
      tags: [Webhooks]
      summary: QR-возврат выполнен
      description: |
        Возврат по сессии выполнен (`qr_refund.status: completed`, `refunded_amount`,
        `receipt_url`). Терминал сессии. Дедуп по `qr_refund.id`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookQrRefund'
      responses:
        '200':
          description: Принято.
  qr_refund.expired:
    post:
      tags: [Webhooks]
      summary: QR-возврат просрочен
      description: |
        Возвратный QR истёк до идентификации (`qr_refund.status: expired`). Терминал сессии.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookQrRefund'
      responses:
        '200':
          description: Принято.
  catalog.item_processed:
    post:
      tags: [Webhooks]
      summary: Позиция каталога обработана
      description: |
        Позиция каталога заведена в Kaspi (`status: active`) либо отвергнута
        (`status: failed`, причина в `error_code`). Шлётся всегда, отключить его нельзя.
        Неуспешная доставка повторяется до трёх раз с нарастающей паузой.
        Сверяйте по `external_ref` (ключ маппинга 1С,
        UNIQUE per org). При bulk-заливке предпочтителен поллинг targeted-GET
        `GET /catalog?external_refs[]=…`; вебхук равноправен для точечных операций.
        Доставки логируются в `GET /catalog/webhook-logs` (ротация 3 дня).
        **При bulk-заливке через per-item очередь (батч-дрип) per-item НЕ шлётся** — его
        заменяет агрегатный `catalog.batch_processed`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCatalogItemProcessed'
      responses:
        '200':
          description: Принято.
  catalog.batch_processed:
    post:
      tags: [Webhooks]
      summary: Bulk-батч каталога обработан
      description: |
        Итог bulk-заливки каталога (POST /catalog инжест-путь): ОДИН агрегированный вебхук
        вместо лавины per-item. Шлётся при завершении батча (все строки финализированы),
        всегда — отключить его нельзя.
        Вебхук шлётся на переход processing→terminal; повторы возможны — дедуплицируйте по
        `(batch_id, status)`. `sample_failed` — до 50 `{external_ref, error_code}` БЕЗ текста
        ошибки (детали — `GET /catalog/errors?batch_id=`). Сценарий: батч `completed`/
        `partially_failed` → при `failed>0` вытяните ошибки через `GET /catalog/errors?batch_id=`,
        полный прогресс — `GET /catalog/batches/{id}`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCatalogBatchProcessed'
      responses:
        '200':
          description: Принято.
  receipt.issued:
    post:
      tags: [Webhooks]
      summary: Фискальный чек выбит
      description: |
        Чек успешно выбит в Kaspi OFD (`POST /receipts`). В `receipt` — `fpd`,
        `operation_id`, `link` (публичная страница чека — открывается в обычном
        браузере), `shift_number`. Шлётся безусловно при
        терминальном статусе чека. Неуспешная доставка повторяется до трёх раз.
        Дедуп по `(event, receipt.id)`. Равноправен поллингу `GET /receipts/{id}`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookReceiptEvent'
      responses:
        '200':
          description: Принято.
  receipt.failed:
    post:
      tags: [Webhooks]
      summary: Не удалось выбить чек
      description: |
        Выбивание чека не удалось. Причина — в `receipt.error_code`
        (`shift_closed` — закрыта смена; `item_not_fiscal`; `rfo_missing`;
        `kaspi_session_invalid` — сессия кассира недействительна, переподключите кассира;
        `kaspi_session_not_configured` — кассир чека деактивирован или удалён к моменту
        выбивания (чек НЕ выбивается от другой кассы);
        `fiscal_receipts_disabled` — запись через целевого кассира приостановлена;
        `receipt_ofd_token_revoked` — отозвана ФИСКАЛЬНАЯ привязка кассы, мерчанту нужно
        перепривязать ОФД в приложении Kaspi; приём оплат при этом работает, встают только
        чек и каталог;
        `receipt_kaspi_error`; `receipt_dispatch_error`). Фискальный документ НЕ создан —
        повтор допустим: после `failed` прежний `client_operation_id` освобождается.
        Повторные попытки доставки — как у `receipt.issued`.
        В песочнице воспроизводится параметром `simulate` в `POST /receipts`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookReceiptEvent'
      responses:
        '200':
          description: Принято.
  subscription.created:
    post:
      tags: [Webhooks]
      summary: Подписка создана
      description: Подписка успешно создана (`POST /subscriptions`). Дедуп по `(event, subscription.id)`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionEvent'
      responses:
        '200':
          description: Принято.
  subscription.payment_succeeded:
    post:
      tags: [Webhooks]
      summary: Платёж подписки прошёл
      description: |
        Счёт подписки оплачен. Доп. поля В КОРНЕ: `invoice_id`, `amount`, `paid_at`.
        Дедуп по `(event, subscription.id, invoice_id)`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionEvent'
      responses:
        '200':
          description: Принято.
  subscription.payment_failed:
    post:
      tags: [Webhooks]
      summary: Платёж подписки не прошёл
      description: |
        Счёт подписки `expired`/`cancelled`. Доп. поля В КОРНЕ: `invoice_id`, `amount`,
        `reason`, `attempt_number`. Система сама перевыставит счёт (пока попыток <
        `max_retry_attempts`) — пересоздавать не нужно. ⚠️ Счёт со статусом `error`
        провалом НЕ считается — этот вебхук не приходит.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionEvent'
      responses:
        '200':
          description: Принято.
  subscription.grace_period_started:
    post:
      tags: [Webhooks]
      summary: Начался льготный период
      description: |
        Retry-попытки исчерпаны, начался grace-период. Доп. поля В КОРНЕ:
        `grace_period_days`, `expires_at`. Любая успешная оплата снимает grace.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionEvent'
      responses:
        '200':
          description: Принято.
  subscription.expired:
    post:
      tags: [Webhooks]
      summary: Подписка истекла
      description: Grace-период истёк, биллинг остановлен НАВСЕГДА (реактивации нет — создавайте новую подписку).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionEvent'
      responses:
        '200':
          description: Принято.
  subscription.paused:
    post:
      tags: [Webhooks]
      summary: Подписка приостановлена
      description: "`POST /subscriptions/{id}/pause`."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionEvent'
      responses:
        '200':
          description: Принято.
  subscription.resumed:
    post:
      tags: [Webhooks]
      summary: Подписка возобновлена
      description: "`POST /subscriptions/{id}/resume`."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionEvent'
      responses:
        '200':
          description: Принято.
  subscription.cancelled:
    post:
      tags: [Webhooks]
      summary: Подписка отменена
      description: "`POST /subscriptions/{id}/cancel` (безвозвратно)."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionEvent'
      responses:
        '200':
          description: Принято.
  webhook.test:
    post:
      tags: [Webhooks]
      summary: Тест вебхука
      description: |
        Ручной тест из ЛК (`POST /api/api-keys/{id}/test-webhook`, 5/мин). Фиктивный
        invoice-конверт со `status: "test"` — receiver должен спокойно его игнорировать.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookTest'
      responses:
        '200':
          description: Принято.
  cashbox.shift_closed:
    post:
      tags: [Webhooks]
      summary: Смена закрыта
      description: |
        Async-закрытие смены завершилось успехом (`POST /cashbox/shifts/close` →
        `operation.status: completed`). «Уже закрыта» тоже приходит как `shift_closed` —
        целевое состояние достигнуто. Шлётся на терминальный переход, но дубли возможны —
        дедуплицируйте по `(event, operation.id)`. Равноправно поллингу
        `GET /cashbox/operations/{id}`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCashboxEvent'
      responses:
        '200':
          description: Принято.
  cashbox.shift_close_failed:
    post:
      tags: [Webhooks]
      summary: Не удалось закрыть смену
      description: |
        Закрытие смены не выполнено. Причина — в `operation.error_code` (`cashbox_no_open_shift`,
        `cashbox_busy`, `cashbox_operation_failed`, `cashbox_disabled`, `kaspi_session_expired`,
        `kaspi_session_not_configured`). Закрытие идемпотентно-безопасно — повторяйте **новым**
        `client_operation_id` (прежний ключ у `failed` не освобождается). Доставка и подпись — как
        у остальных вебхук-событий.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCashboxEvent'
      responses:
        '200':
          description: Принято.
