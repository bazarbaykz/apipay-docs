name: Refresh Context7 Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'openapi.yaml'
      - 'openapi-partner.yaml'
      - 'llms.txt'
      - 'README*.md'
      - 'context7.json'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Context7 refresh
        run: |
          response=$(curl -sS -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CONTEXT7_API_KEY }}" \
            -d '{"libraryName": "/${{ github.repository }}"}')
          echo "$response"

          # too-early — не ошибка: Context7 держит минимальный интервал между обновлениями
          if echo "$response" | grep -q '"error"' && ! echo "$response" | grep -q '"too-early"'; then
            echo "::error::Context7 отклонил refresh"
            exit 1
          fi
