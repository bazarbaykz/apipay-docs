        Снимок подписки мерчанта на ApiPay. Отсутствие тарифа → `status:"none"`
        (НЕ 404). `next_payment.amount` отдаётся всегда (фолбэк на 1-мес цену).
      operationId: partnerTariffShow
      responses:
        "200":
