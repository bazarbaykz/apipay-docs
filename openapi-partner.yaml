  /organizations/{organization}/kaspi-auth/logout:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Kaspi Auth]
      summary: Отключить кассира
      description: >-
        Полностью снимает self-связку организации: удаляет Kaspi-сессию и
        устройство её primary-кассира, переводит подключение в `inactive`.
        Приём платежей по организации после этого невозможен до повторной
        авторизации (`init → send-phone → verify-otp`).


        ⚠️ **Денежное последствие.** Возвраты по счетам, оплаченным через этого
        кассира, после отключения через API не проходят: запрос принимается, но
        возврат завершается статусом `failed` — приходит вебхук
        `invoice.refunded` со `status: failed`. Такие возвраты мерчант проводит
        вручную в приложении Kaspi Pay. Предупредите мерчанта и дайте закрыть
        возвратные обязательства до отключения.


        **Идемпотентно**: организация без подключённого кассира возвращает `200`,
        а не ошибку. Затрагивается только primary-подключение — другие кассиры
        той же организации (multi-cashier) не трогаются. В Kaspi запрос не идёт,
        поэтому узкого лимита `partner-kaspi-auth` здесь нет.


        Для **смены** кассира этот метод не нужен — достаточно
        `POST /kaspi-auth/init` с `force: true`.
      operationId: partnerKaspiAuthLogout
      responses:
        "200":
          description: Кассир отключён (или не был подключён)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    description: Статус persisted-сессии после отключения
                    enum: [none, pending, active, expired]
                    example: none
                  process_status:
                    $ref: "#/components/schemas/ProcessStatus"
                  kaspi_connected:
                    type: boolean
                    example: false
              example:
                success: true
                status: none
                process_status: idle
                kaspi_connected: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProductionRequired"
        "404":
          $ref: "#/components/responses/OrganizationNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /organizations/{organization}/api-key:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [API Keys]
      summary: Выдать / перевыпустить X-API-Key мерчанта
      description: >-
        Создаёт или перегенерирует per-org X-API-Key + webhook. **Идемпотентно**:
        повторный вызов перегенерирует ключ той же записи (`regenerated:true`).
        `key` и `webhook_secret` возвращаются в открытом виде **один раз**.
        `webhook_url` проходит SSRF-валидацию (приватные/внутренние адреса
        отклоняются 422). До одобрения KYC на проде webhook обязан быть доменом
        (не IP/туннель). «Risk»-адрес (nip.io, free-TLD, dynamic-DNS, перехватчик
        типа webhook.site) требует `webhook_justification` (не короче 20 символов)
        и уходит на ручную модерацию: `webhook_review_status:"pending_review"`,
        доставка уведомлений НЕ идёт до одобрения админом.
      operationId: createPartnerApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webhook_url]
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Название ключа
                  example: CRM key
                webhook_url:
                  type: string
                  format: uri
                  maxLength: 500
                  description: URL для webhook-уведомлений (SSRF-валидируется)
                  example: https://your-crm.example.com/webhooks/kaspi
                webhook_secret:
                  type: string
                  maxLength: 255
                  description: >-
                    Секрет для HMAC-подписи webhook (printable ASCII).
                    Генерируется автоматически, если не указан.
                webhook_justification:
                  type: string
                  maxLength: 1000
                  description: >-
                    Объяснение (≥20 символов), почему уведомления идут на risk-адрес.
                    Обязателен для risk-хостов в режиме enforce, иначе
                    422 `webhook_justification_required`.
      responses:
        "200":
          description: Ключ выдан / перевыпущен
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  key:
                    type: string
                    description: X-API-Key мерчанта в открытом виде (показывается один раз)
                  key_id:
                    type: integer
                    example: 200
                  webhook_url:
                    type: string
                    format: uri
                  webhook_secret:
                    type: string
                    description: Секрет webhook в открытом виде (показывается один раз)
                  webhook_review_status:
                    type: string
                    enum: [approved, pending_review, rejected]
                    description: >-
                      Статус модерации webhook-адреса. `approved` — доставка идёт;
                      `pending_review` — risk-адрес на ручной проверке (доставки нет
                      до одобрения); `rejected` — отклонён.
                    example: approved
                  is_org_default:
                    type: boolean
                    description: true только если у организации ещё не было дефолтного ключа
                    example: true
                  regenerated:
                    type: boolean
                    example: false
              example:
                success: true
                key: <plaintext, один раз>
                key_id: 200
                webhook_url: https://your-crm.example.com/webhooks/kaspi
                webhook_secret: whsec_xxxx
                webhook_review_status: approved
                is_org_default: true
                regenerated: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenNotOperating"
        "404":
          $ref: "#/components/responses/OrganizationNotFound"
        "422":
          description: >-
            Ошибка валидации тела (`webhook_url` обязателен) — стандартная
            Laravel-форма; либо отклонение webhook_url — конверт `ErrorEnvelope`
            (`error_code`: SSRF-код валидатора, `webhook_url_requires_domain`,
            `webhook_url_tunnel_forbidden`, `webhook_justification_required` или
            `webhook_url_disallowed_host`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LaravelValidationError"
                  - $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
  /tariff-plans:
