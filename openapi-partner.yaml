  /organizations/{organization}/tariff/pay:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Tariff]
      summary: Оплатить тариф мерчанта
      description: >-
        Оплата тарифа мерчанта партнёром — счёт через Kaspi (dogfooding): телефон
        плательщика в запросе, тариф активируется асинхронно после оплаты
        (webhook `invoice.status_changed` → `paid`). Триал сохраняется —
        оплата продлевает подписку от конца триала/текущего периода.


        Боевая организация — только для **production**-партнёра (иначе
        `403 production_access_required`). Тестовая (sandbox) организация →
        мгновенная мок-активация: HTTP **201**, `payment.status:"completed"`,
        `self_api_invoice_id:null`.
      operationId: partnerTariffPay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier_id, period_months, phone]
              properties:
                tier_id:
                  type: string
                  enum: [start, business, pro]
                  example: business
                period_months:
                  type: integer
                  enum: [1, 3, 6, 12]
                  example: 3
                phone:
                  type: string
                  description: >-
                    Телефон плательщика; нормализуется к `8XXXXXXXXXX`
                    (regex `^8\d{10}$`). Это телефон плательщика, НЕ кассира.
                  pattern: ^8\d{10}$
                  example: "8XXXXXXXXXX"
                set_billing_phone:
                  type: boolean
                  default: false
                  description: >-
                    Записать телефон плательщика как `billing_phone` организации.
                    Авто-продление НЕ включается.
      responses:
        "201":
          description: Платёж создан (боевая — pending; sandbox — completed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  payment:
                    $ref: "#/components/schemas/Payment"
              example:
                success: true
                payment:
                  id: 42
                  amount: 71250
                  status: pending
                  tier: business
                  period_months: 3
                  self_api_invoice_id: 778899
                  external_id: partner-tariff-501-1716900000
                  paid_at: null
                  expires_at: null
                  created_at: "2026-06-20T10:00:00+05:00"
                  failure_reason: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            `production_access_required` — боевая организация у sandbox-партнёра;
            либо `forbidden` — ключ не operating.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
              example:
                success: false
                error: production_access_required
        "404":
          $ref: "#/components/responses/OrganizationNotFound"
        "409":
          description: >-
            `tariff_payment_pending` — у организации уже есть живой неоплаченный
            счёт тарифа (в теле — объект `payment` существующего счёта).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - type: object
                    properties:
                      payment:
                        $ref: "#/components/schemas/Payment"
              example:
                success: false
                error: tariff_payment_pending
                error_code: tariff_payment_pending
                message: У этой организации есть неоплаченный счёт тарифа.
                payment:
                  id: 41
                  amount: 71250
                  status: pending
        "422":
          description: >-
            `invalid_tariff_plan` — неизвестная пара tier_id/period_months
            (конверт `ErrorEnvelope`); либо стандартная Laravel-форма при
            нарушении правил FormRequest (tier_id/period_months/phone).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/LaravelValidationError"
              example:
                success: false
                error: invalid_tariff_plan
                error_code: invalid_tariff_plan
                message: Некорректный тарифный план.
        "429":
          description: >-
            `tariff_payment_cooldown` — слишком много отменённых платежей.
            Заголовок `Retry-After` + поле `retry_after_seconds` (1800).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Секунд до повторной попытки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitEnvelope"
              example:
                success: false
                error: tariff_payment_cooldown
                error_code: tariff_payment_cooldown
                message: Слишком много отменённых платежей. Попробуйте позже.
                retry_after_seconds: 1800
        "503":
          description: >-
            `tariff_payment_unavailable` — self-API недоступен/троттлит (счёт не
            создан, платёж отменён). Заголовок `Retry-After` + поле
            `retry_after_seconds` (30). Партнёр ретраит позже.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitEnvelope"
              example:
                success: false
                error: tariff_payment_unavailable
                error_code: tariff_payment_unavailable
                message: Не удалось создать счёт. Попробуйте позже.
                retry_after_seconds: 30
  /organizations/{organization}/tariff/invoice:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Tariff]
      summary: Выписать счёт на оплату тарифа (INVOICE для юрлиц)
      description: >-
        Синхронно формирует PDF-«Счёт на оплату» тарифа с реквизитами покупателя
        (юрлица) и возвращает публичную ссылку `download_url`. Оплата —
        **банковским переводом**; тариф активируется ВРУЧНУЮ владельцем ApiPay
        после поступления средств — **автоактивации НЕТ**. Счёт виден в истории
        платежей (`GET .../tariff/payments`) как `payment_method=invoice` с
        под-объектом `invoice`; переход статуса `pending`→`completed` = тариф
        выдан (поллинг). Об активации партнёру уходит вебхук `tariff.activated`.


        Боевая организация — только для **production**-партнёра (иначе
        `403 production_access_required`).


        ⛔ Тестовая (sandbox) организация счёт **не получает** —
        `409 test_organization`. Она эфемерна: переход партнёра в production
        удаляет её вместе с тарифом, поэтому реальные деньги на неё не
        принимаются. Тариф песочницы проверяется мок-активацией
        `POST .../tariff/pay`.
      operationId: partnerTariffInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier_id, period_months, buyer_bin, buyer_name]
              properties:
                tier_id:
                  type: string
                  enum: [start, business, pro]
                  example: business
                period_months:
                  type: integer
                  enum: [1, 3, 6, 12]
                  example: 1
                buyer_bin:
                  type: string
                  description: БИН/ИИН покупателя (ровно 12 цифр).
                  pattern: ^\d{12}$
                  example: "123456789012"
                buyer_name:
                  type: string
                  maxLength: 255
                  example: ТОО "Ромашка"
                buyer_address:
                  type: string
                  nullable: true
                  maxLength: 500
                  example: г. Алматы, ул. Абая, 1
                contract:
                  type: string
                  nullable: true
                  maxLength: 255
                  example: Договор №42
      responses:
        "201":
          description: Счёт выписан, PDF готов
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  invoice:
                    $ref: "#/components/schemas/TariffInvoiceIssued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            `production_access_required` — боевая организация у sandbox-партнёра;
            либо `forbidden` — ключ не operating.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
              example:
                success: false
                error: production_access_required
        "404":
          $ref: "#/components/responses/OrganizationNotFound"
        "409":
          description: >-
            `invoice_locked` — другая операция выписки счёта для этой организации
            ещё в процессе, повторите запрос. `test_organization` —
            организация тестовая (`is_test`): счёт на реальные деньги не
            выписывается, ретрай бессмыслен.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: invoice_locked
                error_code: invoice_locked
                message: Другая операция выписки счёта в процессе, повторите.
        "422":
          description: >-
            `invalid_tariff_plan` — неизвестная пара tier_id/period_months
            (конверт `ErrorEnvelope`); либо стандартная Laravel-форма при
            нарушении правил FormRequest (tier_id/period_months/buyer_bin/
            buyer_name/buyer_address/contract).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/LaravelValidationError"
              example:
                success: false
                error: invalid_tariff_plan
                error_code: invalid_tariff_plan
                message: Некорректный тарифный план.
        "429":
          description: >-
            `invoice_cooldown` — превышен антиабуз-лимит выписок за 24ч.
            Заголовок `Retry-After` + поле `retry_after_seconds`.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Секунд до освобождения слота
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitEnvelope"
              example:
                success: false
                error: invoice_cooldown
                error_code: invoice_cooldown
                message: Слишком много выписанных счетов. Попробуйте позже.
                retry_after_seconds: 3600
        "503":
          description: >-
            `invoice_pdf_failed` — не удалось отрендерить PDF счёта (счёт-строка
            остаётся, можно повторить). Партнёр ретраит позже.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: invoice_pdf_failed
                error_code: invoice_pdf_failed
                message: Не удалось сформировать PDF счёта. Попробуйте позже.
  /organizations/{organization}/tariff/payments:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Tariff]
      summary: История платежей тарифа
      description: >-
        Платежи тарифа организации (payment_method `self_api` или `invoice`) по
        убыванию даты. Триальные журнальные записи (amount=0) намеренно исключены.
        У платежей `payment_method=invoice` присутствует под-объект `invoice`
        (`number`, `download_url`, `buyer_name`).
      operationId: partnerTariffPaymentsIndex
      responses:
        "200":
          description: История платежей
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenNotOperating"
        "404":
          $ref: "#/components/responses/OrganizationNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /organizations/{organization}/tariff/payments/{paymentId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: paymentId
        in: path
        required: true
        description: ID платежа тарифа
        schema:
          type: integer
    get:
      tags: [Tariff]
      summary: Карточка платежа тарифа
      operationId: partnerTariffPaymentShow
      responses:
        "200":
          description: Один платёж
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  payment:
                    $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenNotOperating"
        "404":
          description: >-
            `organization_not_found` (чужая/несуществующая орг) либо
            `tariff_payment_not_found` (платёж не принадлежит организации).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthError"
                  - $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: tariff_payment_not_found
                error_code: tariff_payment_not_found
                message: Не найдено.
        "429":
          $ref: "#/components/responses/RateLimited"
  /health:
    get:
      tags: [Health]
      summary: Health аккаунта партнёра
      description: >-
        Агрегат состояния аккаунта партнёра по всем его организациям (без
        внутренних proxy-деталей). Кэшируется ~30с.
      operationId: partnerHealth
      responses:
        "200":
          description: Агрегированный health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerHealth"
              example:
                success: true
                api: { status: ok }
                organizations:
                  total: 12
                  kaspi_connected: 9
                  needs_reauth: 1
                  tariff_active: 7
                  tariff_expired: 2
                  on_trial: 3
                webhooks: { delivered_24h: 340, failed_24h: 5, success_rate: 98.6 }
                rate_limits: { partner_api_per_min: 120 }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenNotOperating"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    PartnerKey:
      type: apiKey
      in: header
      name: X-Partner-Key
      description: >-
        Партнёрский ключ (server-to-server). Выдаётся один раз, хранится sha256.
        Доступен только operating-партнёру.
  parameters:
    OrganizationId:
      name: organization
      in: path
      required: true
      description: ID организации мерчанта
      schema:
        type: integer
  schemas:
    Organization:
      type: object
      description: Карточка организации мерчанта (`<card>`).
      properties:
        id:
          type: integer
          example: 50
        name:
          type: string
          example: ТОО Example
        idn:
          type: string
          nullable: true
          description: БИН/ИИН организации
          example: "123456789012"
        status:
          type: string
          enum: [pending, verified, suspended]
          example: pending
        sandbox_mode:
          type: boolean
          example: false
        has_catalog:
          type: boolean
          example: false
        kaspi_connected:
          type: boolean
          example: true
        session_mode:
          type: string
          nullable: true
          description: Режим Kaspi-сессии (например `self`)
          example: self
        external_id:
          type: string
          nullable: true
          description: Ваш идентификатор клиента в CRM (ключ идемпотентности)
          example: crm-client-42
        origin:
          type: string
          enum: [referral, created, claimed]
          description: Происхождение организации; поле всегда заполнено
          example: created
        payment_status:
          type: string
          enum: [none, active, expired]
          description: Read-only, выводится из тарифа
          example: none
        payment_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Asia/Almaty (+05:00) либо null
        has_active_payment:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
          description: Asia/Almaty (+05:00)
    OrganizationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        organization:
          $ref: "#/components/schemas/Organization"
    Pagination:
      type: object
      description: Плоская пагинация (без meta).
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 42
        last_page:
          type: integer
          example: 2
    ProcessStatus:
      type: string
      description: Состояние процесса авторизации кассира (H1).
      enum: [idle, phone_required, otp_required, active, failed]
    Payment:
      type: object
      description: Платёж тарифа мерчанта.
      properties:
        id:
          type: integer
          example: 42
        amount:
          type: integer
          description: Сумма в тенге
          example: 71250
        status:
          type: string
          description: >-
            Статус платежа (например pending / completed / cancelled).
          example: pending
        tier:
          type: string
          example: business
        period_months:
          type: integer
          example: 3
        self_api_invoice_id:
          type: integer
          nullable: true
          description: ID счёта self-API (null в sandbox/мок-пути)
          example: 778899
        external_id:
          type: string
          example: partner-tariff-501-1716900000
        paid_at:
          type: string
          format: date-time
          nullable: true
          description: Asia/Almaty (+05:00) либо null
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        failure_reason:
          type: string
          nullable: true
        invoice:
          description: >-
            Присутствует ТОЛЬКО у платежей `payment_method=invoice` (счёт на
            организацию). Иначе поле отсутствует.
          allOf:
            - $ref: "#/components/schemas/PaymentInvoiceRef"
    PaymentInvoiceRef:
      type: object
      description: Краткая ссылка на выписанный счёт в объекте платежа.
      properties:
        number:
          type: integer
          description: Сквозной номер счёта
          example: 14
        download_url:
          type: string
          format: uri
          description: Ссылка на PDF счёта; открывается без авторизации — передавайте её только покупателю
          example: https://apipay.kz/invoices/xxxxxxxx/download
        buyer_name:
          type: string
          example: ТОО "Ромашка"
    TariffInvoiceIssued:
      type: object
      description: Выписанный «Счёт на оплату» тарифа (INVOICE).
      properties:
        payment_id:
          type: integer
          example: 42
        number:
          type: integer
          description: Сквозной номер счёта
          example: 14
        amount:
          type: integer
          description: Сумма в тенге
          example: 25000
        tier:
          type: string
          example: business
        period_months:
          type: integer
          example: 1
        status:
          type: string
          description: Всегда `pending` при выписке (активация вручную).
          example: pending
        buyer:
          type: object
          properties:
            bin:
              type: string
              example: "123456789012"
            name:
              type: string
              example: ТОО "Ромашка"
            address:
              type: string
              nullable: true
              example: null
            contract:
              type: string
              nullable: true
              example: null
        download_url:
          type: string
          format: uri
          description: Ссылка на PDF счёта; открывается без авторизации — передавайте её только покупателю
          example: https://apipay.kz/invoices/xxxxxxxx/download
        created_at:
          type: string
          format: date-time
          description: Asia/Almaty (+05:00)
          example: "2026-07-09T12:00:00+05:00"
    TariffSnapshot:
      type: object
      description: Снимок подписки мерчанта на ApiPay.
      properties:
        status:
          type: string
          enum: [none, trial, active, expired]
          example: active
        tier:
          type: string
          nullable: true
          example: business
        is_trial:
          type: boolean
          example: false
        started_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        days_remaining:
          type: integer
          example: 92
        auto_renew:
          type: boolean
          example: false
        last_payment:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/LastPayment"
        next_payment:
          $ref: "#/components/schemas/NextPayment"
    LastPayment:
      type: object
      properties:
        amount:
          type: integer
          example: 71250
        paid_at:
          type: string
          format: date-time
          nullable: true
        period_months:
          type: integer
          example: 3
        tier:
          type: string
          example: business
        status:
          type: string
          example: completed
    NextPayment:
      type: object
      description: Следующий платёж; `amount` отдаётся всегда (фолбэк 1 мес).
      properties:
        due_at:
          type: string
          format: date-time
          nullable: true
          description: Конец периода (активный/триал) либо null (истёкший)
        amount:
          type: integer
          example: 71250
        tier:
          type: string
          example: business
    TariffPlan:
      type: object
      properties:
        tier_id:
          type: string
          example: business
        period_months:
          type: integer
          example: 3
        price:
          type: integer
          example: 71250
        discount_percent:
          type: integer
          example: 5
        label:
          type: string
          example: Business — 3 месяца
        price_per_month:
          type: number
          example: 23750
    TariffTier:
      type: object
      properties:
        id:
          type: string
          example: business
        label:
          type: string
          example: Business
        daily_limit:
          type: integer
          nullable: true
          description: >-
            Дневной лимит счетов из каталога тарифов: start 30, business 100,
            pro 300. `null` — лимит в каталоге не задан, объём согласуется
            индивидуально; ни у одного из действующих тарифов null не
            встречается.
          example: 100
        base_price:
          type: integer
          example: 25000
    PartnerHealth:
      type: object
      properties:
        success:
          type: boolean
          example: true
        api:
          type: object
          properties:
            status:
              type: string
              example: ok
        organizations:
          type: object
          properties:
            total:
              type: integer
            kaspi_connected:
              type: integer
            needs_reauth:
              type: integer
              description: |
                Мерчанты, у которых нет ни одного РАБОЧЕГО кассира: коннекшн отключён ЛИБО его
                Kaspi-сессия мертва (`session_status` ∈ {expired, error}).
                Пока сессия мертва, счета/чеки мерчанта отдают `409 kaspi_session_expired`.
            tariff_active:
              type: integer
            tariff_expired:
              type: integer
            on_trial:
              type: integer
        webhooks:
          type: object
          properties:
            delivered_24h:
              type: integer
            failed_24h:
              type: integer
            success_rate:
              type: number
              nullable: true
              description: null при 0 событий за 24ч
        rate_limits:
          type: object
          properties:
            partner_api_per_min:
              type: integer
              example: 120
    SuccessFlag:
      type: object
      properties:
        success:
          type: boolean
          example: true
    ErrorEnvelope:
      type: object
      description: >-
        Конверт ошибки контроллера/сервиса Partner API. Legacy-ключ `error`
        дублирует `error_code`. `errors` — только на 422 из контроллерной
        проверки.
      required: [success, error, error_code, message]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Legacy-алиас error_code
          example: not_cashier
        error_code:
          type: string
          example: not_cashier
        message:
          type: string
          description: Безопасное ru-сообщение (без утечки внутренних деталей)
          example: Номер не является кассиром Kaspi.
        errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
    RateLimitEnvelope:
      description: ErrorEnvelope + `retry_after_seconds` (тарифные лимиты 429/503).
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - type: object
          properties:
            retry_after_seconds:
              type: integer
              example: 1800
    AuthError:
      type: object
      description: >-
        Сокращённая форма ошибок слоя аутентификации и проверки доступа.
        Содержит только `success` и `error`; для
        `forbidden` (не operating) дополнительно дублируется `error_code`.
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: organization_not_found
        error_code:
          type: string
          description: Присутствует только для `forbidden`
    LaravelValidationError:
      type: object
      description: >-
        Стандартная Laravel-форма 422 из FormRequest / inline-`validate`
        (org-index/store, cashier_phone, otp, webhook_url, tariff-pay-поля).
        Без `success`/`error_code`.
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    RateLimited:
      type: object
      description: Стандартный ответ Laravel-троттла (429).
      properties:
        message:
          type: string
          example: Too Many Attempts.
  responses:
    Unauthorized:
      description: >-
        Неверный/отсутствующий X-Partner-Key: `partner_key_missing` (нет
        заголовка), `invalid_partner_key` (не найден/неактивен),
        `partner_user_missing` (у партнёра нет user). Тело — сокращённая форма
        `{ success:false, error }`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
          example:
            success: false
            error: invalid_partner_key
    ForbiddenNotOperating:
      description: >-
        Партнёр не operating (referral-тип или неактивный ключ). Тело
        `{ success:false, error:"forbidden", error_code:"forbidden" }`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
          example:
            success: false
            error: forbidden
            error_code: forbidden
    ProductionRequired:
      description: >-
        Боевая организация у sandbox-партнёра:
        `production_access_required` (403). Также возможен `forbidden` при
        не-operating ключе. Тело — сокращённая форма `{ success:false, error }`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
          example:
            success: false
            error: production_access_required
    OrganizationNotFound:
      description: >-
        Организация не принадлежит партнёру или не существует
        (`organization_not_found`, 404 — не раскрываем существование чужих орг).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"
          example:
            success: false
            error: organization_not_found
    LaravelValidationError:
      description: Ошибка валидации (стандартная Laravel-форма).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LaravelValidationError"
    RateLimited:
      description: >-
        Превышен rate-limit (группа — 120/min, создание организаций — 10/min,
        шаги авторизации кассира — 10|60/min). Заголовок `Retry-After`, тело —
        стандартная Laravel-форма.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Секунд до следующей попытки
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimited"
# ---------------------------------------------------------------------------
# Партнёрские вебхуки (X-Webhook-Signature).
#
# OpenAPI 3.0 не имеет top-level `webhooks` (это ключ 3.1). Используем
# расширение `x-webhooks` (совместимо с Redoc) с той же структурой, что
# path-операции. Формат payload идентичен публичному API — см. docs/ru/webhooks.md.
#
# ⚠️ timestamp внутри payload приходит в UTC (+00:00), в отличие от дат
# HTTP-ответов API (+05:00).
# ---------------------------------------------------------------------------
x-webhooks:
  invoice.status_changed:
    post:
      summary: Изменение статуса счёта
      description: >-
        Отправляется на `webhook_url` per-org ключа при смене статуса счёта.
        Подпись — заголовок `X-Webhook-Signature: sha256=<HMAC-SHA256(body,
        webhook_secret)>`. Поле `error_code` внутри `invoice` — additive, только
        если non-null (отсутствует, например, для статуса `paid`).
        `kaspi_source_type` / `kaspi_sale_type` присутствуют, когда известны
        после оплаты.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: invoice.status_changed
                invoice:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1234
                    status:
                      type: string
                      example: paid
                    amount:
                      type: integer
